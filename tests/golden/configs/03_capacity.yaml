# 縮小設定 (make golden)。本番と同じ形で、規模だけ小さくする。
name: golden_03
seeds:
  reservoir: 0
  drive: 1
  surrogate: 4
drive:
  distribution: uniform
  washout: 20
reservoir:
  input_scale: 1.0
  density: 0.2
  n_replicates: 2
mc_sweep:
  rho_grid:
  - 0.5
  - 0.95
  leak_rate_grid:
  - 0.3
  - 1.0
  sigma_u: 0.1
  n_units: 30
  n_steps: 2000
ipc_sweep:
  rho_grid:
  - 0.5
  - 0.95
  leak_rate_grid:
  - 1.0
  sigma_u: 0.2
  n_units: 20
  n_steps: 3000
conservation:
  n_units_grid:
  - 10
  - 20
  state_noise_grid:
  - 0.0
  - 0.01
  rho: 0.95
  leak_rate: 1.0
  sigma_u: 0.2
  n_steps: 3000
  max_delay_by_degree:
  - 12
  - 6
  - 3
  n_replicates: 1
length_sweep:
  n_steps_grid:
  - 2000
  - 3000
  rho: 0.95
  leak_rate: 1.0
  sigma_u: 0.2
  n_units: 20
mc:
  max_delay: 20
  alpha: 1.0e-09
  threshold_mode: surrogate
  n_surrogates: 8
  surrogate_quantile: 0.99
  chunk_size: 64
ipc:
  max_delay_by_degree:
  - 8
  - 4
  - 2
  max_variables: 2
  basis: legendre
  input_distribution: uniform
  alpha: 1.0e-09
  threshold_mode: surrogate
  n_surrogates: 8
  n_surrogate_targets: 2
  surrogate_quantile: 0.99
  chunk_size: 64
  max_targets: 20000
  max_degrees: 20
narma:
  length: 800
  n_lags_sweep:
  - 10
  - 30
  n_replicates_sweep: 2
  base:
    name: golden_03_narma10
    n_replicates: 2
    seeds:
      reservoir: 0
      task: 1
      split: 2
    split:
      train_ratio: 0.5
      val_ratio: 0.15
      test_ratio: 0.35
      washout: 20
      max_start_offset: 20
    ridge:
      alpha_grid:
      - 1.0e-06
      - 0.001
      - 1.0
      n_lags_grid:
      - 10
      - 20
    tasks:
    - kind: mackey_glass
      params:
        tau: 17.0
        beta: 0.2
        gamma: 0.1
        exponent: 10
        rk4_step: 0.1
        sample_interval: 10
        integration_burn_in: 100
        length: 800
        horizon: 1
      reservoir:
        n_units: 30
        spectral_radius: 0.9
        leak_rate: 0.3
        input_scale: 0.5
        bias_scale: 0.1
        topology:
          kind: erdos_renyi
          density: 0.2
        activation: tanh
        state_noise: 0.0
    - kind: delay_parity
      params:
        n_bits: 2
        delay: 1
        length: 800
      reservoir:
        n_units: 30
        spectral_radius: 0.9
        leak_rate: 1.0
        input_scale: 1.0
        bias_scale: 0.1
        topology:
          kind: erdos_renyi
          density: 0.2
        activation: tanh
        state_noise: 0.0

# 3-T / 3-C'': **縮小設定でも掃引の値は絶対値なので、明示しないと本番の格子が
# 走る** (n_units 25/50/100、T 5000/20000/80000 で実測 22 分)。ゴールデンは
# 秒未満で回る格子を書き下す。
topology_ladder:
  n_units: 25
  n_steps: 900
  n_graphs: 1
  n_replicates: 1
  # N を 12 まで落とすと ER のマスクが全ゼロになり
  # 「生成した W のスペクトル半径が 0」で落ちる (実測)。
  sweeps:
    - axis: n_units
      values: [20, 25]
    - axis: rho
      values: [0.8, 0.95]
narma_operating:
  # N=6 だと ER のマスクが全ゼロになり得る (実測で落ちた)。
  n_units_grid: [20, 30]
  leak_rate_grid: [0.5, 1.0]
ladder_threshold:
  n_surrogates_grid: [5]
  quantile_grid: [0.9]
  n_graphs: 1
  n_replicates: 1
