# ゴールデンテスト用の縮小設定 (実験04)。用途は 01 の縮小設定と同じ。
name: golden_04

base:
  name: golden_04_base
  n_replicates: 2
  seeds:
    reservoir: 0
    task: 1
    split: 2
  split:
    train_ratio: 0.5
    val_ratio: 0.15
    test_ratio: 0.35
    washout: 20
    max_start_offset: 20
  ridge:
    alpha_grid: [1.0e-6, 1.0e-3, 1.0]
    n_lags_grid: [1, 4, 8]
  mackey_glass:
    tau: 17.0
    beta: 0.2
    gamma: 0.1
    exponent: 10
    rk4_step: 0.1
    sample_interval: 10
    integration_burn_in: 100
    length: 1200
    horizon: 1
  delay_parity:
    n_bits: 2
    delay: 1
    length: 1200
  esn_mackey_glass:
    n_units: 30
    spectral_radius: 0.9
    leak_rate: 0.3
    input_scale: 0.5
    bias_scale: 0.1
    density: 0.2
    activation: tanh
    state_noise: 0.0
  esn_delay_parity:
    n_units: 30
    spectral_radius: 0.9
    leak_rate: 1.0
    input_scale: 1.0
    bias_scale: 0.1
    density: 0.2
    activation: tanh
    state_noise: 0.0

lorenz:
  rk4_step: 0.002
  sample_interval: 5
  integration_burn_in: 100
  length: 1200
  horizon: 1
  standardize_steps: 300

mackey_glass:
  standardize_steps: 300

freerun:
  warmup_steps: 20
  free_run_steps: 100
  stats_steps: 300
  valid_time_threshold: 0.4

stability:
  spectral_radius_grid: [0.9, 1.3]
  leak_rate_grid: [0.3, 1.0]
  state_noise_grid: [0.0, 1.0e-3]
  n_replicates: 2
  surrogate_seed: 4

lyapunov:
  estimator:
    method: perturbation
    delta: 1.0e-08
    renorm_interval: 10
    max_growth: 1000.0
    check_propagator: true
    propagator_tol: 1.0e-10
  reference_value: 0.9056
  reference_rel_tol: 0.05

mc:
  max_delay: 20
  alpha: 1.0e-09
  threshold_mode: surrogate
  n_surrogates: 8
  surrogate_quantile: 0.99
  chunk_size: 64

ipc:
  max_delay_by_degree: [8, 4, 2]
  max_variables: 2
  basis: legendre
  input_distribution: uniform
  alpha: 1.0e-09
  threshold_mode: surrogate
  n_surrogates: 8
  n_surrogate_targets: 2
  surrogate_quantile: 0.99
  chunk_size: 64
  max_targets: 20000
  max_degrees: 20
