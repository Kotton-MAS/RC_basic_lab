# ゴールデンテスト用の縮小設定 (実験01)。
#
# 本番の experiments/01_what_is_rc/config.yaml と**同じ経路**を通しつつ、
# 系列長・格子・レプリケート数だけを小さくしたもの。科学的な結論は出ない。
# ここで見るのは「リファクタ前後で成果物が 1 バイトも変わらないか」だけ。
name: golden_01
n_replicates: 2

seeds:
  reservoir: 0
  task: 1
  split: 2

split:
  train_ratio: 0.5
  val_ratio: 0.15
  test_ratio: 0.35
  washout: 20
  max_start_offset: 20

ridge:
  alpha_grid: [1.0e-6, 1.0e-3, 1.0]
  n_lags_grid: [1, 4, 8]

mackey_glass:
  tau: 17.0
  beta: 0.2
  gamma: 0.1
  exponent: 10
  rk4_step: 0.1
  sample_interval: 10
  integration_burn_in: 100
  length: 600
  horizon: 1

delay_parity:
  n_bits: 2
  delay: 1
  length: 600

esn_mackey_glass:
  n_units: 30
  spectral_radius: 0.9
  leak_rate: 0.3
  input_scale: 0.5
  bias_scale: 0.1
  density: 0.2
  activation: tanh
  state_noise: 0.0

esn_delay_parity:
  n_units: 30
  spectral_radius: 0.9
  leak_rate: 1.0
  input_scale: 1.0
  bias_scale: 0.1
  density: 0.2
  activation: tanh
  state_noise: 0.0
