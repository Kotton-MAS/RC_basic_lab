[project]
name = "rc-basics-lab"
version = "0.1.0"
description = "Reservoir computing basics lab: baselines, diagnostics, experiments"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rc_basics_lab"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
    "scikit-learn>=1.9.0",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "T20", # flake8-print: print() 禁止 (CLAUDE.md の規約を機械的に強制)
    "RUF", # ruff 固有ルール
]

[tool.mypy]
strict = true
# CLAUDE.md の「Any 禁止」を機械的に強制
disallow_any_explicit = true
exclude = ["\\.venv"]

# scipy / matplotlib は型スタブを同梱しない。呼び出し側に `# type: ignore` を撒く
# 代わりに、ここでモジュール単位の未解決 import だけを許容する (仕様 T1)。
[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "mpl_toolkits.*"]
ignore_missing_imports = true
