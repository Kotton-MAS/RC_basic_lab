# 実験02: ESP・スペクトル半径・リーク率
#
# 未知キーは ConfigError で即座に落ちる (D-09)。
#
# 実験ごとに設定クラスを分ける (D-13)。このファイルは Esp02Config を埋める
# もので、01 の ExperimentConfig とはローダ (load_config_as) だけを共有する。
#
# リザバー構造 (input_scale / n_units / density / n_replicates) は
# reservoir セクションに1本だけ持つ (F-02-1-004)。decay / timescale_sweep /
# esp_map に n_units を書くと未知キーとして落ちる。

name: 02_esp_and_dynamics

seeds:
  # 3ストリームは独立 (D-14)。初期状態対 (probe) をリザバー重み (reservoir) と
  # 別に振れることが「初期状態だけを変えたときに判定が変わるか」の前提。
  reservoir: 0
  drive: 1
  probe: 3

drive:
  distribution: uniform
  n_steps: 3000
  # washout は λ と自己相関にだけ効く。ESP の距離当てはめは過渡そのものが
  # 測定対象なので washout を掛けない (experiment/esp.py の
  # ESP_DISTANCE_WASHOUT を参照)。
  washout: 200
  # 比較軌道の本数。無入力・rho>1 の ESN は +x* / -x* の対をなす吸引子を持つ
  # ことがあり、比較軌道が全部同じ側へ落ちる確率が約 2^-k 残る。実測で
  # 3 本では rho=1.2 / 1.5・無入力を「収束」と誤判定する draw があったため 10 本。
  n_pairs: 10

reservoir:
  # 入力強度は信号側 (sigma) だけで振る (D-17)。input_scale は掃引中固定。
  input_scale: 1.0
  # N=200 はサイクル1と同じ (連載を通した比較可能性)。
  n_units: 200
  density: 0.1
  n_replicates: 3

decay:
  # 受け入れ条件1 の値そのもの。rho<1 は収束、rho>1 は非収束になるはず。
  rho_grid: [0.5, 0.8, 0.95, 1.2, 1.5]
  # 2-A は「無入力なら rho<1 が必要条件」を見る図なので入力を入れない。
  sigma_u: 0.0
  leak_rate: 1.0

timescale_sweep:
  leak_rate_grid: [0.1, 0.2, 0.3, 0.5, 0.7, 1.0]
  # 理論線 -1/log(1-a) と重ねるため rho は 1 未満に固定する。
  rho: 0.9
  sigma_u: 0.5

esp_map:
  # 1.0 の両側を等間隔に挟む16点 (0.4 .. 1.9)。
  rho_grid:
    [0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9]
  # sigma_u = 0 は無入力で図では別枠。以降は対数的に広げ、rho>1 でも ESP が
  # 成立する側 (sigma_u >= 1) まで届かせる。強度は標準偏差であって振幅ではない。
  sigma_grid: [0.0, 0.05, 0.1, 0.2, 0.5, 1.0, 2.0]
  leak_rate: 1.0

washout:
  # 2-D (T4) 用。T3 の成果物はこのセクションを読まない。
  grid: [0, 50, 100, 200, 400, 800]
  pad_series: true
  base:
    name: 02_washout_sensitivity
    n_replicates: 5
    seeds:
      reservoir: 0
      task: 1
      split: 2
    split:
      train_ratio: 0.5
      val_ratio: 0.15
      test_ratio: 0.35
      washout: 200
      max_start_offset: 200
    ridge:
      alpha_grid:
        [
          1.0e-10, 1.0e-9, 1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3,
          1.0e-2, 1.0e-1, 1.0, 10.0, 100.0,
        ]
      n_lags_grid: [1, 2, 4, 8, 16, 32, 64]
    mackey_glass:
      tau: 17.0
      beta: 0.2
      gamma: 0.1
      exponent: 10
      rk4_step: 0.1
      sample_interval: 10
      integration_burn_in: 1000
      length: 8200
      horizon: 1
    delay_parity:
      n_bits: 2
      delay: 1
      length: 8200
    esn_mackey_glass:
      n_units: 200
      spectral_radius: 0.9
      leak_rate: 0.3
      input_scale: 0.5
      bias_scale: 0.1
      density: 0.1
      activation: tanh
      state_noise: 0.0
    esn_delay_parity:
      n_units: 200
      spectral_radius: 0.9
      leak_rate: 1.0
      input_scale: 1.0
      bias_scale: 0.1
      density: 0.1
      activation: tanh
      state_noise: 0.0

# 診断の判定基準 (D-15: 診断の設定は ctx ではなく cfg で渡る)。
esp:
  # D-16 の既定値。abs_tol=1e-6 は float64 の eps から十分離れ、初期距離
  # O(1) から6桁の収縮を要求する。
  abs_tol: 1.0e-6
  rel_tol: 1.0e-3
  window: 200
  # 距離当てはめの開始位置。ESP_DISTANCE_WASHOUT=0 なのでこの値が
  # そのまま開始ステップになる。無入力 rho=0.5 の距離は t≈46 で floor を
  # 割るため、D-16 の既定 50 では当てはめ点が 0 点になる。
  fit_skip: 10
  floor: 1.0e-14

lyapunov:
  # perturbation 以外は ValueError (解析 Jacobian 版の差し込み口)。
  method: perturbation
  delta: 1.0e-8
  renorm_interval: 1
  # YAML 1.1 は 1.0e3 を文字列と解釈する (指数に符号が要る)。1000.0 と書く。
  max_growth: 1000.0
  # 伝播器の入力インデックスずれを実行時に落とす。切ってはいけない (D-18)。
  check_propagator: true
  propagator_tol: 1.0e-10

timescale:
  max_lag: 200
