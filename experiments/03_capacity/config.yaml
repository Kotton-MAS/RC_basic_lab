# 実験03: メモリ容量 (MC) と情報処理容量 (IPC)
#
# 未知キーは ConfigError で即座に落ちる (D-09)。
#
# 実験ごとに設定クラスを分ける (D-13)。このファイルは Capacity03Config を
# 埋めるもので、01 の ExperimentConfig / 02 の Esp02Config とはローダ
# (load_config_as) だけを共有する。
#
# n_units は**セクションが持つ** (D-32)。MC は上限線 y=N を引ける規模
# (N=200)、IPC は目標数が (次数 x 遅延) で増えるため小さい規模 (N=50) が要る。
# reservoir セクションに n_units を書くと未知キーとして落ちる。

name: 03_capacity

seeds:
  # reservoir / drive は SeedStream 経由 (01・02 と同じ4ストリームの2本)。
  reservoir: 0
  drive: 1
  # surrogate は SeedStream ではなく DiagnosticContext.seed へ直接渡る整数。
  # 全条件・両診断で1個を共有する (共通乱数法、D-37)。
  surrogate: 4

drive:
  distribution: uniform
  # 診断へ渡す ctx.washout。実際の基準点は t0 = max(washout, 最大遅延) で、
  # 本番では最大遅延 (MC 400 / IPC 60・3-B' は 200) の側が binding になる (D-24)。
  washout: 200

reservoir:
  # 横断共有はこの3つだけ (D-32)。入力強度は信号側 (sigma_u) で振る (D-17)。
  input_scale: 1.0
  density: 0.1
  n_replicates: 3

mc_sweep:
  # 6 x 3 x 3レプリケート = 54 条件 (仕様 §5 の 3-A)。
  rho_grid: [0.5, 0.7, 0.9, 0.95, 1.0, 1.1]
  leak_rate_grid: [0.3, 0.6, 1.0]
  # T2-5 の較正で確定した値。0.05 は rho=1.0 付近で mc_effective_delay が
  # 非単調になり (leak=0.3)、0.5 は準線形域を外れて rho 依存が 1.5 倍に届かない。
  # 受け入れ条件1 を満たす最小値がこの 0.1 (較正の実測は design.md §11.5、T5)。
  sigma_u: 0.1
  n_units: 200
  n_steps: 20000

ipc_sweep:
  # 4 x 3 x 3レプリケート = 36 条件 (仕様 §5 の 3-B)。
  rho_grid: [0.5, 0.8, 0.95, 1.1]
  leak_rate_grid: [0.3, 0.6, 1.0]
  # 次数分解には中程度の駆動が要るため 3-A とは別の動作点を持つ (仕様 §3.2)。
  # 図をまたいだ絶対値比較はしない。
  sigma_u: 0.2
  n_units: 50
  n_steps: 100000

conservation:
  # 3 x 3 x 3レプリケート = 27 条件 (仕様 §5 の 3-B')。
  n_units_grid: [25, 50, 100]
  # 0.0 はノイズ無しの基準点 (同じ図に乗る)。
  state_noise_grid: [0.0, 0.01, 0.1]
  rho: 0.95
  leak_rate: 1.0
  sigma_u: 0.2
  n_steps: 200000
  # 3-B' でだけ ipc.max_delay_by_degree を上書きする (片方向)。保存則は
  # 打ち切りの外に残った容量が見えないと N に届かないため深く取る。
  max_delay_by_degree: [200, 60, 20, 10]
  # null なら reservoir.n_replicates を継承する。予算超過時の縮退規則
  # (仕様 §7 リスク1) のノブで、3-B' だけを 1 に落とせる。
  n_replicates: null

# 3-S (D-116): 駆動入力の対称性と IPC の偶数次。make symmetry-03 用。
# figures-03 には含めない。振るのは**平均のずれだけ**で、分布 (一様) と
# 標準偏差 (sigma_u) は変えない —— 一様のままなら Legendre 基底は標準化後も
# 厳密に正規直交で、D-28 を満たしたまま測れる。分布の形を歪めると容量が
# 二重計上され、「偶数次が増えた」のか「二重計上が増えた」のかを分離できない。
symmetry_sweep:
  # sigma_u の倍数。0.0 がゼロ対称の基準点。
  offset_ratio_grid: [0.0, 0.5, 1.0, 2.0, 3.0]
  # 3-B と同じ動作点にそろえる (図をまたいで読めるように)。
  rho: 0.95
  leak_rate: 1.0
  sigma_u: 0.2
  n_units: 50
  n_steps: 30000
  n_replicates: 3

length_sweep:
  # make saturation-03 用。figures-03 には含めない (T=1e6 まで回すため)。
  n_steps_grid: [100000, 200000, 500000, 1000000]
  rho: 0.95
  leak_rate: 1.0
  sigma_u: 0.2
  n_units: 50

# 診断の判定基準 (D-15: 診断の設定は ctx ではなく cfg で渡る)。
mc:
  max_delay: 400
  # 容量の定義そのものが「線形読み出しで到達可能な最大の説明率」なので、
  # 検証分割による alpha 選択 (D-04) は行わず固定の微小値を使う (D-25)。
  alpha: 1.0e-9
  threshold_mode: surrogate
  n_surrogates: 100
  surrogate_quantile: 0.99
  chunk_size: 256

ipc:
  max_delay_by_degree: [60, 20, 10, 6]
  max_variables: 3
  # (input_distribution, basis) は対で意味を持つ。未対応の組は ValueError (D-28)。
  basis: legendre
  input_distribution: uniform
  alpha: 1.0e-9
  threshold_mode: surrogate
  n_surrogates: 100
  n_surrogate_targets: 4
  surrogate_quantile: 0.99
  chunk_size: 256
  max_targets: 200000
  max_degrees: 20

narma:
  # 3-C (公平な対照での NARMA10)。係数と入力分布は tasks/narma.py のモジュール
  # 定数であり設定にしない (D-29)。ここが持つのは系列長と 01 側の土台だけ。
  #
  # base は 01 の ExperimentConfig をまるごと内包したもので、3-C は
  # run_task(base, entry, plan0=...) をそのまま通す (D-31)。したがって
  # 公平性の3決定 (D-04 同一 alpha 格子 / D-05 同一分割 / D-08 構造 HP を
  # 検証分割で選ばない) は 01 の経路がそのまま担保する。
  length: 8000
  # 3-C' (D-95): タップ数の軸を振って、先行 (Goudarzi et al. 2014) の
  # 動作点 k/n_train ≈ 1 まで届かせる。3-C 本体の n_lags_grid とは別軸で、
  # 各点が独立に plan_replicate を通る (t0 も分割もその k のものになる)。
  # 上限 2500 は「列数が行数以上になる」手前で止めたもの (実測: k=2600 で
  # n_train=2600 になり scipy が singular matrix を送出。k=2500 で k/n=0.943)。
  n_lags_sweep: [10, 30, 100, 300, 800, 1500, 2200, 2500]
  # 掃引は傾向を見るものなので 3 本で足りる (3-C 本体は 5 本)。
  n_replicates_sweep: 3
  base:
    name: 03_narma10
    n_replicates: 5
    seeds:
      reservoir: 0
      task: 1
      split: 2
    split:
      train_ratio: 0.5
      val_ratio: 0.15
      test_ratio: 0.35
      washout: 200
      max_start_offset: 200
    ridge:
      # 01 (experiments/01_what_is_rc/config.yaml) と**同一の格子**にする
      # (D-04)。3-C の主張は「探索予算をそろえた比較」なので、01 と別の
      # alpha 格子を使うと 01 の結果と並べて読めなくなる。一致は
      # tests/test_experiment_narma.py::test_narma10_alpha_grid_is_shared_across_methods
      # が本番 YAML どうしで突き合わせる。
      alpha_grid:
        [
          1.0e-10, 1.0e-9, 1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3,
          1.0e-2, 1.0e-1, 1.0, 10.0, 100.0,
        ]
      # 要件書「タップ数を妥当な範囲 (k=10〜30) に抑え」。NARMA10 の目標は
      # u[t-1] と u[t-10] の積を含むので、k < 10 では対照が構造的に届かない
      # (対照を不当に弱くしない)。上端 30 は要件書の指定そのまま。
      n_lags_grid: [10, 15, 20, 25, 30]
    # 課題は**リスト**である (拡張性方針 §3 / D-123)。
    #
    # 3-C が読むのは mackey_glass エントリのリザバー**1本だけ**
    # (experiment/narma.py の NARMA10_ESN_SECTION)。NARMA10 は連続値入力の
    # 回帰課題で、漏れ積分が効く点で MG と同型だからである。
    #
    # n_units = 50 は D-39 (仕様 §8、ユーザー承認済み): 参照値 (0.16 / 0.107)
    # が N = 50 規模の報告であり、N=200 で回すと『先行より良い』が規模差なのか
    # 対照設計の差なのか分離できない。3-B (IPC 掃引、N=50) とそのまま
    # 突き合わせられる利点もある。D-08 により N は検証分割で選ばれないので、
    # 宣言した1点をそのまま報告する。
    tasks:
      - kind: mackey_glass
        params:
          tau: 17.0
          beta: 0.2
          gamma: 0.1
          exponent: 10
          rk4_step: 0.1
          sample_interval: 10
          integration_burn_in: 1000
          length: 8000
          horizon: 1
        reservoir:
          n_units: 50
          spectral_radius: 0.9
          leak_rate: 0.3
          input_scale: 0.5
          bias_scale: 0.1
          topology:
            kind: erdos_renyi
            density: 0.1
          activation: tanh
          state_noise: 0.0
      # 内包した 01 の ExperimentConfig の一部だが 3-C では**不活性**である
      # (課題は narma10 の1本だけで、build_tasks は通らない, D-31)。値の効きの
      # 実測は 01 側 (tests/test_config_wiring.py) へ委譲する。
      - kind: delay_parity
        params:
          n_bits: 2
          delay: 1
          length: 8000
        reservoir:
          n_units: 200
          spectral_radius: 0.9
          leak_rate: 1.0
          input_scale: 1.0
          bias_scale: 0.1
          topology:
            kind: erdos_renyi
            density: 0.1
          activation: tanh
          state_noise: 0.0

# 実験 3-T: 交絡を1つずつ剥がす対照の梯子 (make ladder-03、D-138)
#
# 「スケールフリーは記憶容量に効くか」は既に主張がある問いなので、BA を足して
# 測るだけでは追試にしかならない。同じ密度で ER と BA を比べると次数分布・
# 相互結合率・自己ループが同時に動く (D-131) ので、1つだけ動かした水準を並べる。
#
# 本命は degree_preserving との比較である —— BA の優位が残るなら効いているのは
# 次数分布、消えるなら生成過程が作る別の何かである。
#
# グラフと重みを入れ子にする。実測 (N=50, T=20000) でグラフ間 s.d. 0.69〜0.83、
# 重み間 s.d. 0.71〜0.94 と同程度なので、片方だけでは足りない。
#
# 密度は 2m/N = 0.08 で全水準そろえる (揃えないと「密度が違うから容量が違う」
# という一番つまらない交絡が最初に効く)。
topology_ladder:
  rho: 0.95
  leak_rate: 1.0
  sigma_u: 0.2
  n_units: 50
  n_steps: 20000
  state_noise: 0.0
  n_graphs: 8
  n_replicates: 3
  # 密度は書かない。BA の 2m/N に実行時でそろえ直す (D-139)。
  # N を振る以上、ここに固定値を書いても N=50 でしかそろわない。
  levels:
    - kind: erdos_renyi
    - kind: control
      base: {kind: erdos_renyi}
      symmetrize: true
    - kind: control
      base: {kind: erdos_renyi}
      drop_self_loops: true
    - kind: degree_preserving
      base: {kind: barabasi_albert, m: 2}
    - kind: barabasi_albert
      m: 2
  # 掃引はここに並べた順で回り、同じ CSV に sweep_axis 列で区別して入る。
  sweeps:
    # §3: トポロジの順位は N に依存するか (物理リザバーは小さい N に住む)
    - axis: n_units
      values: [25, 50, 100]
    # §4: ノイズなしで選んだ最適トポロジは、ノイズ下でも最適か
    - axis: state_noise
      values: [0.0, 0.01, 0.1]
    # 先行の主張は「広い rho の範囲で BA が優れる」「rho > 1 でも保つ」。
    # 1点で測っている限り反証も追認もできないので rho > 1 まで振る (D-140)。
    - axis: rho
      values: [0.5, 0.8, 0.95, 1.1, 1.3]
    # §6-2: ハブ型は飽和に必要な T が長いか。長いなら同じ T で ER と BA を
    # 比べた結果は BA を過小評価しており、この梯子自身の結論も疑われる。
    - axis: n_steps
      values: [5000, 20000, 80000]
