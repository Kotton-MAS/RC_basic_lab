# 高速プリセット: 構造を保ったまま小さくする (--preset quick)
#
# **本体 config.yaml との差分だけ**を書く。全部書き写すと、本体を直したときに
# プリセットだけ古いままになる (実測: そういう複製が「効いていない設定」を生む)。
#
# 目的は「手元で振って傾向を見る」ことなので、比較の構造 (3手法 x 2課題 x
# 同一分割・同一格子) は崩さない。崩すと quick で見た傾向が本番と別物になる。
#
# 実測 (2026-08-31): 既定 1.2 秒 -> quick 1.1 秒。01 は元から速いので効きは
# 小さい。効くのは 02〜05 である (下表)。

n_replicates: 2

ridge:
  # 格子は間引くが両端は残す。端を削ると「端に張り付いた」が見えなくなる。
  alpha_grid: [1.0e-10, 1.0e-6, 1.0e-2, 1.0]
  n_lags_grid: [1, 8, 64]

mackey_glass:
  length: 2200

delay_parity:
  length: 2200

esn_mackey_glass:
  n_units: 50

esn_delay_parity:
  n_units: 50
