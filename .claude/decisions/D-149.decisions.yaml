- id: D-149
  rule: "手引き (docs/guide/) が名指しするリポジトリ相対パスは実在させる (tests/test_guide_references_resolve.py が解決する)。雛形は <name> のような記法にして実在を求めない。実測値を散文に書くときは、それが分布の1点なのか性質なのかを書き分ける。同じ判別子が2箇所にある場合 (kind: ring) は、名前ではなく型で見分けが付くことを検査で固定する"
  rationale: "棚卸しの D-3 に挙がった残件をまとめて閉じたもの。(1) docs/guide/条件を変えて試す.md が experiments/01_what_is_rc/presets/scalefree.yaml を2箇所で名指しし、片方は実行例そのものだったのに**ファイルが存在しなかった** —— 読者がコピーして貼ると落ちる。F-ID / D-ID と同じ形で参照解決のテストを足したところ、さらに2件見つかった: tests/test_type_glossary.md (実体は .py、単純な誤り) と experiments/06_something/config.yaml (雛形なので <name> 記法へ変えた)。(2) topology.py の『ER の自己ループ 17 本』は**1シードの値**だった。実測 (N=200 / density=0.1 / 200 シード) は平均 19.7、範囲 10〜32、s.d. 4.4、期待値 N*density = 20 である。他の3つの 0 本は構成上そうなるのでシードによらず、**同じ表に分布の1点と構造的な性質が混ざっていた**。(3) kind: \"ring\" はトポロジ (ESN の結合だけ閉路) とモデル (SCR そのもの) の2箇所にある。書く場所が違うので設定は取り違えようがないが読む人は取り違えるので、docstring に YAML の2例を並べ、両者が別の型でトポロジ側が n_units を持たないことをテストで固定した (名前を変えると既存の成果物と YAML が壊れるため、名前ではなく見分けを守る)。(4) ARTIFACT_RTOL の実装差 1.5e-3 は GitHub Actions の macOS runner と開発機の比較で、**どちらも BLAS は Accelerate** である。OpenBLAS / MKL との差は未測定なので、そう書いた —— 測っていない範囲を『測った』と読める書き方にしない"
  guard_test: "tests/test_guide_references_resolve.py::test_every_path_named_by_a_guide_exists"
