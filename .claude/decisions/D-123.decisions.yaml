- id: D-123
  rule: "課題は ExperimentConfig.tasks のリストで持つ。要素は kind で選ぶ判別子つき union (TaskSpec) で、課題の生成パラメータ (params) とその課題で使うリザバー (reservoir) の組である。課題を1本足すのは tasks/<name>.py + TaskConfig / TaskSpec の union に1行ずつ + tasks/registry.build_task に case を1つ + config/experiment01.with_length に case を1つ + YAML に3行。TASK_LENGTH_FIELDS と esn_<task> の平行フィールドは置かない"
  rationale: "課題を1つ足すのに触る場所が、リザバーを1つ足すのに触る場所より多かった。ExperimentConfig には mackey_glass / delay_parity / esn_mackey_glass / esn_delay_parity という**平行なフィールドが4つ**並び、さらに TASK_LENGTH_FIELDS という写経が1枚あり、washout 感度実験 (D-19) の系列長補償は『TASK_LENGTH_FIELDS への登録』と『variant_for 本体の名指しのキーワード引数』という2段の配線を要求していた。どちらも実行時にしか気づけず、片方を忘れると補償が黙って外れるので、忘れを検出するためだけに ValueError と NotImplementedError を投げるコードが 60 行あった。リストにすると variant_for は base.tasks を一様に回すだけになり、登録も配線もその検出コードも消える。params と reservoir を分けるのは、MackeyGlassConfig を 04 と 05 も使うためである —— 課題設定にリザバーを埋めると、リザバーを使わない経路までその設定を引きずり、meta.json にも出る。**写経が完全に消えたわけではない**: dataclasses.replace は union の上では型が解けない (params が Never に落ちる) ので、系列長を差し替える with_length に match が1つ残る。ただし mypy の網羅性検査が見るので、足し忘れは**型検査で落ちる** —— 実行時にしか気づけなかった2段から、静的に落ちる1段になったぶんが前進である。ローダには2つ足した: tuple の要素をスカラ以外にも許す (リストにした瞬間に読めなくなるため) のと、プリセットのマージで kind を持つ要素のリストを要素ごとに重ねること (プリセットは『本体との差分だけを書く』規約であり、課題を1つ小さくするために課題定義を全部書き写すと本体を直したときにプリセットだけ古いまま残る)。--set は tasks.mackey_glass.params.length のように kind で要素を選ぶ —— 添字にすると並び順を替えただけで意味が変わる。asdict は ClassVar の KIND を落とすので、そのまま読み直すと2番目の課題が先頭の型として作られる。config/_dump.as_plain_mapping は**リストの要素にだけ** kind を書く (単一フィールドは『書かなければ先頭』という既定があるので位置から型が決まり、書くと既存の meta.json が動く)。成果物は meta.json の設定の形だけが変わり、**縮小設定で再生成した CSV と PNG は1バイトも変わらない**ことを test_golden で確認した。3-C の NARMA10 を同じ union に載せるのは見送った —— Narma10Config は base に ExperimentConfig を丸ごと内包し、確保量の検査がリザバーの n_units を読むので、純粋な課題設定に割るのは別の変更である。変異注入: TaskConfig の要素から length を落とすと guard_test が赤"
  guard_test: "tests/test_experiment_washout.py::test_every_task_config_carries_a_length"
