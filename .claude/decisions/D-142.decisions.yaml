- id: D-142
  rule: "容量測定は解析解のオラクルで**絶対値を当てる**検査を持つ。完全遅延線 (列 k が u[t-k-1]) では mc_total と ipc_linear が厳密に段数 K、mc_profile は最初の K 個が 1 で残りが 0。P2(u[t-1]) 1列だけの系では容量が全部次数2に乗り mc_total は 0。梯子は n_steps も掃引し、トポロジの順位が T に依存しないことを同じ成果物の中で示す"
  rationale: "既存の検査は保存則 (ipc_total <= N)・単調性・飽和比の下限で、どれも**容量が体系的に何割か目減りしていても緑で通る**。実際 mc_total を 0.95 倍に潰す変異を注入すると既存のテストは全て通り、絶対値を当てる新しいオラクルだけが赤くなった。方針書 §6-1 が挙げる外部実装 (kubota0130/ipc) との突き合わせは同じ目的だが、解析解のほうが**外部リポジトリを持ち込まずに絶対値を固定できる**ぶん規律に合う (実行時依存も dev 依存も増やさない)。実測: 完全遅延線 K=10 / T=8000 で mc_total = 10.0000、mc_profile は遅延1..10 がちょうど 1.0、11以降が 0.0、ipc_linear = 10.0000。P2 1列では ipc_nonlinear = 1.006 / ipc_linear = 0.0003 / mc_total = 0.00088。完全遅延線の非線形成分は**本来 0** なので、そこに出る値はまるごと有限標本の偽陽性であり、T=4000 で 0.338、T=16000 で 0.045 と T を4倍にして半分以下に縮む —— 縮まないなら系統誤差である、という形の検査にした。変異注入で捕まる範囲: 次数の割り振りを入れ替える / 容量を 0.95 倍に目減りさせる / 遅延を1つずらす / 遅延の符号を反転する。n_steps を梯子の掃引軸に足すのは §6-2 の問い (ハブ型は飽和に必要な T が長いか) のためで、長いなら同じ T で ER と BA を比べた文献は BA を過小評価していることになり、**この梯子自身の結論 (D-140) も同じ疑いを受ける**。自分の結論を脅かす軸は同じ成果物の中に入れておく。掃引の (軸, 値) は組でしか意味を持たない (n_steps の 900 を n_units に入れると 900 ユニットのリザバーになる) ので、配線検査の『波及していないこと』の判定を『ケースが宣言した葉と一致すること』へ一般化した"
  guard_test: "tests/test_diagnostics_memory_capacity.py::test_the_memory_capacity_of_a_perfect_delay_line_is_exactly_its_length"
