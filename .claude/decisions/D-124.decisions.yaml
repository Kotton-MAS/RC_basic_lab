- id: D-124
  rule: "掃引軸はモデルの数値フィールドそのものとし、一覧を書き下さない。掃引側は reservoir.axes の numeric_axes / require_axes / with_axis / axis_value を通してモデルに触り、モデル固有の型 (ESNConfig) に絞らない。軸名はモデルの言葉のままにし、モデル間で共通化しない。成果物の density 列は registry.reservoir_density がモデルごとに定める"
  rationale: "require_esn が 3-C / 04 を ESN に縛っていた。理由は『掃引軸が spectral_radius / leak_rate / state_noise という ESN 固有の概念だから』だったが、実測するとこの3軸は ESNConfig / DeepESNConfig / RingConfig の**3モデルすべてが持っている**。縛っていたのは軸ではなく型である。軸をフィールドから導けば (numeric_axes)、同じ掃引コードが3モデルで回る —— 実測: 4-C の条件 (rho=1.3 / leak=0.6 / noise=1e-3) を RingConfig と DeepESNConfig に適用でき、密度もそれぞれ 0.0050 / 0.1000 と正しく出る。**軸の一覧をモデルごとに書き下さない**のは、フィールドを1つ足したときに一覧の更新を忘れる経路を作らないためで、フィールドが軸である。**軸名をモデル間で共通化しない**: leak_rate を持たないモデルに別名を生やすと『同じ名前だが意味が違う軸』ができ、図をまたいだ比較が静かに壊れる。集合が違うことを許し、持っていない軸を要求されたら『持っている軸はこれ』と並べて落とす (メッセージに候補を入れるのは、落ちた人が次に何を書けばよいか同じ行から読めるようにするため)。with_axis に type: ignore が1つ残る —— dataclasses.replace はキーワードが動的だと T が dataclass であることを型で示せない。軸名が実在することと値が数値であることは require_axes が実行時に確かめるので、**ignore を置くのはこの1箇所だけ**にし、呼び出し側には撒かない。density 列を reservoir_density に移したのは、RingConfig が topology を持たず config.topology を直接読む経路が落ちるためで、リングは巡回結合なので 1/N である (ESN の値は nominal_density のままなので成果物は動かない)。YAML で axes: を宣言する形 (方針書 §4 の後半) は見送った: 掃引の格子は成果物の rho / leak_rate / state_noise 列と図の軸に直結しており、宣言形式を変えると記事の CSV の列名が動く。**成果物は1バイトも動いていない** (test_golden と test_artifact_invariance が緑、results/ の変更 0 件)。変異注入: with_axis が leak_rate 以外も動かすと guard_test が赤"
  guard_test: "tests/test_reservoir_axes.py::test_with_axis_changes_only_that_axis"
