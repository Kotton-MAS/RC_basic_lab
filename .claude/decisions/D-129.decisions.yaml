- id: D-129
  rule: "meta.json の設定ブロックは config/_dump.as_plain_mapping を通して書き、判別子 (KIND) を名乗る dataclass には**位置によらず常に** kind を書く。読み直すと元の設定に戻ることを round-trip の検査で固定する"
  rationale: "dataclasses.asdict は KIND が ClassVar なので落としてしまい、meta.json から『どのモデル・どの課題・どのトポロジで回したか』が復元できなかった。実測: RingTopologyConfig は フィールドが0個なので {} になり情報がゼロ、RingConfig (SCR) と ESNConfig は topology / activation の**有無**でしか区別できない、BarabasiAlbertConfig は {'m': 2} から推測するしかない。コミット済みの results/**/meta.json を検索すると kind という文字列が1件も無かった。かつては単一フィールドに kind を書かない判断をしていた —— 既存の meta.json を動かさないためである。**その前提はもう無い**: (1) kind を振ることがこのリポジトリの主題になった、(2) density -> topology の変更で meta.json はどのみち動いて指紋を取り直した、(3) as_plain_mapping はテストからしか呼ばれておらず、meta.json を書くのは asdict のほうだった —— **『読み直せる形』を作ったのに、永続する記録は読み直せない形で書かれていた**。シリアライザが2本あって弱いほうが成果物に使われている状態である。results/ は読者に届く唯一のもの (CLAUDE.md) で、meta.json はその素性の記録なので、素性が読めない記録は記録として弱い。検査は『書いたものを読み直すと元に戻る』という性質にした —— 文字列の有無ではなく round-trip なので、kind の書き出しを外すと union の先頭として組み直され未知キーで落ちる。変異注入: _plain から kind の書き出しを外すと guard_test が赤"
  guard_test: "tests/test_meta_round_trip.py::test_the_meta_config_block_rebuilds_the_production_config"
