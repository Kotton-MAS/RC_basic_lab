- id: D-148
  rule: "容量測定は他実装 (kubota0130/ipc) の**算法**とも突き合わせる。あちらのコードをそのまま動かすのではなく、算法の核 (状態行列の SVD で正規直交基底を作り、目標をそこへ射影する) を numpy へ書き写して同じ状態行列に通し、per-delay の容量が一致することを測る"
  rationale: "D-142 の解析解オラクル (完全遅延線で MC = 段数) は『実装が数学どおりか』を見るが、『文献と同じ土俵か』は見ない。両者は別物で、3-T の結論を先行と突き合わせて書く以上、後者も要る (研究方針 §6-1)。あちらのコードをそのまま動かさないのは2つの理由による: cupy (GPU) と pandas に依存していて CI の実行環境で動かない / テスト時に外部リポジトリを取りに行くと CI がネットワークに依存する。**MIT なので取り込むことはできるが、取り込んでも動かない**。書き写したのは singular_value_decomposition (中心化した状態行列の SVD と特異値のしきい値 max(sigma^2)*N*eps) と get_ipc (射影係数の二乗和を z.z で割る) の2つで、合わせて20行に満たない。写し間違いは一致しないことで露見する —— こちらは設計行列を組んでリッジで解き決定係数を取る経路で、**解き方も行合わせも違う**ので、両方が同じ間違いをすることは考えにくい。実測: 本番設定 (N=50 / T=20000 / 遅延30本) で最大絶対差 4.7e-7、合計 12.869596 対 12.869590。ゴールデン設定 (T が短い) では最大 4.4e-5 で、差の出どころはこちらのリッジ (alpha=1e-9) である。許容を 2e-4 に置いたのは、行合わせを1つずらす変異が 0.1 以上ずれるためで、その500分の1でも検出力は落ちない (変異注入で確認)。オラクルがこちらの実装を経由していないことも、状態行列を壊すと参照側だけが追随することで測る"
  guard_test: "tests/test_ipc_cross_implementation.py::test_the_per_delay_capacity_matches_the_reference_algorithm"
