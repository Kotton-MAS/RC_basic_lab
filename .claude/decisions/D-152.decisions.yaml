- id: D-152
  rule: "図の外に出した凡例と footnote は、**描画後の実寸**で中身の下へ積み直す (settle_outside_artists を save_png が呼ぶ)。行数からの見積りは初期位置にしか使わない。系統名そのものは括弧を持たない —— 括弧を添えるのは method_label の1箇所だけ"
  rationale: "凡例の重なりは3サイクル指摘され続けた。前回 (棚卸しの C-1) は凡例の上端を figure 座標の定数 -0.02 に固定し、footnote を凡例の行数から見積もって下へ置く形にした。**どちらも描画前の推定**なので、supxlabel の注記が2行に折り返された図や軸ラベルの長い図では足りず、実測で fig_esp_decay / fig_pr_curves / fig_threshold_tradeoff がまだ食い込んでいた。推定を精密にする方向は際限が無いので、**一度描いてから測る**形へ変えた: 凡例と footnote を隠して tight bbox を取り、その下端の下に凡例を置き、凡例の実際の window extent の下に footnote を置く。constrained layout は figure.legend と figure.text を配置に数えないので、この2つだけを後から動かしても軸は動かない。テストも推定値ではなく get_window_extent で描かれた矩形を測る形にした —— 推定のままの座標を見るテストは、推定が外れる場面でこそ空振りする。あわせて凡例の二重括弧を直した: method_label は mark を渡されると『(対照と区別できる)』を自分で添えるのに、系統名の側にも『(対照)』が入っていたため『一様乱数 (対照) (対照と区別できない)』になっていた。括弧を添えるのは1箇所だけ、という約束をテストで固定する (名前側の括弧を禁止し、mark つきのラベルの括弧がちょうど1組であることを見る)。4-C の図には各マスがレプリケートをどう畳んだか (多数決、同数なら悪い方へ) の注記を足した —— 本文が『格子 80 点』と書く一方で図は 16 マスなので、書かないと読者が数を突き合わせられない。変異注入で3件とも赤: 積み直しをやめる / footnote を凡例の上に置く / 系統名の括弧を戻す"
  guard_test: "tests/test_plotting_layout.py::test_the_outside_artists_clear_the_content_after_settling"
