- id: D-144
  rule: "NARMA10 の勝敗が手法側の動作点で変わることを実験 3-C'' (narma10_operating.csv) で実測する。振るのは ESN の n_units と leak_rate だけで、課題のパラメータ・alpha 格子・分割は触らない。行には成績と一緒にその動作点のリザバーの容量分解を出す"
  rationale: "先行 (Kubota & Nakajima, Dynamical Anatomy of NARMA10 Benchmark Task) は NARMA10 が位相空間に不安定領域を持ち**課題側**の動作点 (入力範囲・初期値) で結果が変わるので公平な比較を妨げると論じている。記事 03 §3.1 の実測 (宣言した分布の内側でも定数入力 0.5 なら 33 ステップで発散) は独立に同じ現象へ到達している。ここが足すのは**手法側**で、2つ合わせると『NARMA10 は両側の動作点に敏感で、単独の数値に意味がない』という一段強い主張になる。3-C 本体は D-39 により N=50 の1点を報告するが、その1点で『ESN が遅延線に負けた』と書くと動作点を1つ選んだ結果を現象として報告することになる。実測 (N 4点 x リーク率 3点 = 12 点、5レプリケート、実測 6.5 秒): 遅延線は動作点によらず NRMSE 0.3920 で一定、ESN は 0.2248 〜 0.6956 と**3倍以上**動き、12 点のうち 2 点 (N=100/leak=1.0 と N=200/leak=1.0) で ESN が勝つ。**方針書の仮説 (容量の 2/3 が要求されていない非線形へ行くから負ける) は、割合では説明できなかった**: 非線形の割合は 0.485〜0.832 だが、ESN が勝つ点の割合は 0.682 と 0.832 で、負ける点にも 0.798 / 0.831 がある。勝敗を分けるのは**線形容量の絶対値**で、ipc_linear で並べると 7.98〜19.27 が全敗、25.99 と 27.27 が全勝と完全に分離する。遅延線が選ぶタップ数は 25〜30 なので、**ESN は自分の線形容量が遅延線に許されたタップ数を超えたときに勝つ**という定量的な言い方ができる。リザバーを使わない手法 (linear / delay_line / delay_line_ols) の成績が動作点によらず一定であることを検査に置くのは、掃引が課題や分割まで動かしていたら対照そのものが壊れるためで、それが起きると勝敗が動いた原因を動作点に帰せない。変異注入で4件とも赤: 動作点を土台に反映しない / 課題のパラメータまで動かす / 格子を直積にしない / 非線形の割合を取り違える"
  guard_test: "tests/test_narma_operating.py::test_only_the_esn_moves_with_the_operating_point"
