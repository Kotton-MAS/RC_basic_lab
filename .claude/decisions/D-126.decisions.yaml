- id: D-126
  rule: "汎用基盤 (tasks / reservoir / readout / diagnostics / datasets / metrics* / seeds / split / types / cli / overrides / experiment の rows_csv・diagnostics_rows・capacity_bounds) は連載側 (experiment の各実験パイプライン / plotting / config / meta / experiments / results) を import しない。課題の生成パラメータは生成関数と同じモジュールに置き、config/ からは再エクスポートする。docs は汎用 (docs/guide/) と連載 (docs/series/ ・ docs/plans/) に分ける"
  rationale: "このリポジトリは連載記事のための実験リポジトリとして始まったが、中身は『どの実験からでも使える基盤』と『記事5本』の2つに分かれている。**汎用側だけを別リポジトリへ持ち出せる形**にしておけば、分ける日が来たときに git の操作だけで切れる —— そのためには汎用側が連載側を import していないことが要る。実測すると逆流は7件あり、すべて『課題の生成パラメータ (MackeyGlassConfig / DelayParityConfig / LorenzConfig / SyntheticAnomalyConfig) が config/ にある』ことが原因だった。生成関数と同じモジュールへ移し、config/ からは再エクスポートする (D-49 が公開名の維持を要求するため)。NARMA10 だけは別で、tasks/narma.py の確保量検査が『length * リザバーの n_units』を見ており、課題層がリザバーを知る必要があった。純粋な Narma10TaskConfig (length だけ) に割り、上限検査は experiment/capacity_bounds.validate_state_matrix_bounds へ移した —— **リザバーを知っている側でしか掛けられない検査である**。境界は粗く引く: config/ はローダ本体 (_common / _dump) だけを見れば汎用だが、実験ごとの設定 dataclass と同居しているのでパッケージごと連載側にした。**細かくするほど守られなくなる**。report / summary / meta も連載側である (01 の ResultRow と ExperimentConfig を知っているので、持ち出しても単体では動かない)。汎用の CSV 書き出し (write_rows_csv) だけを experiment/rows_csv.py へ切り出した。split.py はトップレベルへ出した —— config が SplitConfig を再エクスポートするので、experiment/ に置いたままだと config -> experiment/__init__ -> config の循環になる (実測で ImportError)。**分類漏れを許さない**検査を対で置いた: 新しいモジュールがどちらにも分類されていなければ赤くする。許すと、境界が守られているように見えて実際には測っていない状態になる。パッケージ名 rc_basics_lab は変えない —— 231 ファイルが含んでおり、境界を先に作っておけば実際に切り出す日に改名してもコストは変わらない。成果物は1バイトも動かない (results/ の変更 0 件、test_golden 緑)。変異注入: 汎用側から連載側を import すると赤、汎用の集合を削って緑にしようとしても赤"
  guard_test: "tests/test_core_series_boundary.py::test_the_core_never_imports_the_series"
