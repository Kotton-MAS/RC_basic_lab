- id: D-141
  rule: "内容指紋 (content_sha256) は実測値のキーを深さを問わず落とす。落とす対象は名前が VOLATILE_JSON_KEYS のものと、部分木ごと落とす VOLATILE_JSON_SUBTREES (wall_time_breakdown) の2種類だけで、**接尾辞の規則では決めない**。test_artifact_invariance は内容指紋をバイト指紋と独立に照合し、バイトが一致していて内容指紋だけ食い違う場合を『内容指紋の列が古い』として別に報告する"
  rationale: "内容指紋は top-level のキーしか落としておらず、04 / 05 の meta.json が再生成のたびに『内容が変わった』側に出ていた。実際に動いていたのは wall_time_breakdown の下の capacity_s / stability_s などの実測値だけである。実行時間しか動いていないのに毎回説明を要する行が2件出る状態は、**本当に説明を要する行を見落とす**方向に効く —— この分類は『説明が要るか要らないか』の唯一の入口だからである。落とし方を『*_s で終わる名前』にする案は採れない: 05 の total_budget_s と wall_time_budget_s.* は**設定値**で、落とすと予算を変えたことが内容指紋に出なくなる。測った値と設定した値が同じ接尾辞を共有している以上、名前ではなく『どの節にあるか』で決めるしかない。落としすぎを捕まえるため volatile_json_paths を公開し、本番の meta.json 5 枚で落ちるパスの全件を表に固定した (新しいキーを足して表を更新しなければ赤くなる)。作業中に別の穴が見つかった: **test_artifact_invariance はバイト指紋が一致した時点で content_sha256 を見ずに次へ進んでいた**。指紋の取り方を変えても列が古いまま緑で通り、そのあと本物の退行が起きたときに古い値との比較で『実行時の値だけが変わった』側へ分類されて素通りする。内容指紋を先に、独立に照合する形へ変えた。変異注入で6件とも赤: 入れ子へ潜らない / 予算まで落とす / 内容指紋の照合を元の順序に戻す / 内容が変わっても timing 側へ入れる / 古い内容指紋を stale ではなく無視する / 落ちるパスの表を変える。**この変更で成果物は1バイトも動いていない** —— 動いたのは判定器のほうなので、artifact_manifest.csv の meta.json 3 行だけを書き直した"
  guard_test: "tests/test_artifact_content_digest.py::test_a_budget_is_not_mistaken_for_a_measurement"
