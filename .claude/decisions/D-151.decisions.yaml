- id: D-151
  rule: "make test は pytest-xdist の -n auto で並列に走らせる。並列にできる前提 (テストが results/ へ書かない) は tests/test_suite_is_parallel_safe.py がソースから読んで守る"
  rationale: "テスト全件が直列で 118 秒まで伸び、フックの予算 120 秒に張り付いていた。**時間が予算に張り付くと『遅いから落ちた』と『壊れたから落ちた』が区別できなくなる** —— 実際このセッションで2回、タイムアウトの 143 を見てから中身を調べる羽目になった。個別に遅いテストは無く (上位15件で 35 秒、残り 83 秒が 1,944 件の裾) 削って解決する形ではないので、並列にした。実測: 直列 118 秒 -> 並列 24〜27 秒、3 回とも 1,944 件全件パス。pytest-xdist は dev グループへ入れる (実行時依存は増やさない。D-62、networkx をオラクルに入れたのと同じ扱い)。並列で壊れる形は『並列のときだけ落ちる』という一番読みにくい壊れ方なので、前提を機械で守る: results/ へ書くテストが無いこと (成果物は make figures-0N だけが作る) をソースから読んで確かめる。**実行して確かめる形にしない** —— 並列で走っている最中に『いま並列か』を問うガードは直列で走らせた瞬間に空振りする (CLAUDE.md の学習メモにある、環境がガードを覆い隠す形そのもの)。Makefile が -n auto を渡す以上、宣言が消えると pytest が引数を知らずに起動すら失敗するので、pyproject と Makefile の両方に宣言が在ることも見る"
  guard_test: "tests/test_suite_is_parallel_safe.py::test_no_test_writes_into_results"
