- id: D-121
  rule: "これから足す決定は .claude/decisions/D-NNN.decisions.yaml に1件1ファイルで書く。.claude/decisions.yaml は D-120 までの保管庫として据え置き、追記しない (既存の決定の改訂だけを許す)"
  rationale: "決定を1件足すたびに decisions.yaml の末尾が変わるので、並行する2本のブランチが必ず衝突していた。D-120 で merge=union を入れて手元では解決したが、**GitHub のマージはこれを見ない**。実測: #25 をマージした main へ #23 をマージするとき、手元 (main の作業ツリー、.gitattributes あり) では衝突 0 件、同じ base と head で GitHub は CONFLICTING と判定した。属性を外して手元で再現すると .claude/decisions.yaml が1件だけ衝突し、GitHub の判定と一致する。つまり union は『実際にマージする場所』では効いていない。さらに git は**作業ツリー側の .gitattributes** を見るので、.gitattributes を含まないブランチの上でマージすると手元でも効かない (#23 で実際に起きた)。1件1ファイルなら並行ブランチが別々のファイルを作るので、どこでマージしても衝突しない —— union のような『マージの仕方』に依存せず、**触る場所を分ける**ことで消える。ファイル名を D-NNN.decisions.yaml とするのは、キットの check-decisions.sh が *decisions.yaml で対象を選ぶためで、編集時のスキーマ検証をそのまま効かせられる (D-121.yaml にすると検証が静かに外れる)。中身を1要素のリストにするのは check_decisions.py がマッピングのリストを期待するため。保管庫を分割せず据え置くのは、119 件を動かすと #23 / #24 と新たに衝突を作るからで、**衝突を無くす変更が衝突を作っては本末転倒である**。変異注入: D-121 を decisions.yaml 側へ書くと guard_test が赤"
  guard_test: "tests/test_decisions_layout.py::test_new_decisions_are_not_appended_to_the_archive"
