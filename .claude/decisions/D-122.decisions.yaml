- id: D-122
  rule: "結合行列 W を取る診断は diagnostics/topology.py に置き、X を取る診断 (D-01) とは別の署名族として扱う。2つの族は pkgutil 列挙のときに**第1引数の名前** (X か W か) で分ける。モデルから行列を取り出すのは reservoir.registry.require_graph だけで、解析側は isinstance(res, GraphReservoir) で分岐しない"
  rationale: "スケールフリー解析には次数分布やスペクトルが要るが、これらは状態系列 X ではなく結合行列 W の関数である。同じ Diagnostic Protocol に混ぜると『X 引数を受け取って無視する診断』が生まれ、tests/test_diagnostics_base.py の D-01 契約テスト (X/u/y/ctx 以外に必須引数を作らない) が意味を失う —— 無視してよい引数がある、という前例ができるため。族の分け方を**モジュール名の除外リスト**にしなかったのは、トポロジ診断を1本足すたびにリストへ写経する義務が増え、写経を忘れた診断が静かに D-01 側へ落ちるからである。第1引数の名前で分ければ、族の違いそのもの (何を入力に取るか) が判定条件になり、新しい診断は書いた瞬間に正しい族へ入る。両族が交わらないことと、W 族が f(W, *, ctx=None, cfg=...) に揃っていることを固定してある。GraphReservoir を Reservoir の5面に足さないのは『再帰行列を持つ』がリザバー一般に要求できる性質ではないためで (外部素子のモデルは持たないことがある)、require_esn と同じ流儀で必要とする側が require_graph で要求する。黙って素通しにすると『トポロジ診断の行だけが静かに消えた成果物』ができ、再生成しても誰も気づけない。DeepESN の adjacency() は**層間の辺も含める**: 落とすとグラフが n_layers 個の連結成分に割れ、平均最短路長やスモールワールド指標が『層の中だけの値』になる (guard は層内だけの行列より到達率が高いことを実測する)。実行時依存は増やしていない —— 次数分布・スペクトル・クラスタ係数・平均最短路長は numpy と scipy.sparse.csgraph で書け、networkx は dev グループのテストオラクル専用にした (D-62 と同じ扱い)。実装が自前でも答えは外部実装と突き合わせてある (nx.transitivity / nx.all_pairs_shortest_path_length / out_degree)。変異注入: topology.py の第1引数を W から X に変えると guard_test が赤"
  guard_test: "tests/test_diagnostics_topology.py::test_the_two_families_never_overlap"
