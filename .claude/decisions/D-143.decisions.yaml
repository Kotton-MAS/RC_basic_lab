- id: D-143
  rule: "梯子の結論が閾値の選び方で動かないことを実験 3-Th (capacity_topology_threshold.csv) で実測する。しきい値なしとサロゲート (本数 x 分位点) の格子を回し、**MC と IPC に同じ判定基準を課す**。軌道は条件ごとに1回だけ作り、判定基準の数だけ診断をやり直す。chi2 は格子に入れない"
  rationale: "容量はサロゲートのしきい値で切ってから足す (D-27)。既定の n_surrogates=100 / surrogate_quantile=0.99 は**判定基準そのもの**なので、値によって水準の順位が動くなら、梯子 (D-138〜D-142) が語っているのは現象ではなく閾値の選び方である。既存の capacity_threshold.py はモード (surrogate / chi2 / none) を代表条件1つで比べるだけで、サロゲートの本数と分位点は振っておらず、見ているのも総容量の絶対値であって水準間の順位ではない。実測 (N=50 / rho=0.95 / T=20000、4グラフ x 2重み = 8対): BA - ER の MC はしきい値なしで -2.529、サロゲートの9通り (本数 25/100/400 x 分位点 0.95/0.99/0.999) で -2.520 〜 -2.546 に収まる。**幅 0.026 は効果の約1%**で、閾値を全く課さない場合すら含めて順位も大きさも動かない。chi2 を格子に入れないのは MC が chi2 を持たない (次数1しか測らないため SUPPORTED_THRESHOLD_MODES が (surrogate, none) の2つ) からで、入れると MC と IPC で違う基準を並べることになり『順位が動いたのは閾値か診断の違いか』を分けられなくなる。モードの比較自体は capacity_threshold.py が既にやっている。MC と IPC に同じ基準を課すのも同じ理由である。実験計画を梯子より小さく (4グラフ x 2重み = 8対) したのは、問いが『順位が動くか』であって効果量の推定ではないためで、梯子の実測 (BA - ER = -1.92、対ごとの s.d. 0.8) なら8対で符号検定 p = 0.004 に届く。変異注入で5件とも赤: 判定基準ごとに軌道を作り直す / しきい値を MC に課さない / しきい値なしを格子から外す / 生の容量に閾値後の値を書く / 格子を空にする。**MC の反応を測る検査は tiny 設定では空振りした** —— ゴールデンの max_delay=20 では全遅延が閾値を超えて何も切られず、MC の列が条件ごとの定数になる。テスト側で max_delay=120 へ広げて、切られる側の遅延が必ず在る状態にした (本番の 400 では常に在る)"
  guard_test: "tests/test_ladder_threshold.py::test_both_diagnostics_respond_to_the_threshold_setting"
