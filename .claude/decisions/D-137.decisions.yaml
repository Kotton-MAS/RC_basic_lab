- id: D-137
  rule: "容量の測定器は『答えが解析的に分かっている状態行列』で検証する (完全な遅延線 / 単一次数の状態)。トポロジは系列長掃引 (LengthSweepConfig.topologies) の軸として振れるようにし、振ったときだけ condition_id に topology が入る"
  rationale: "既存の IPC / MC のテストは機構 (保存則・打ち切り・しきい値・分割) を見ていて、**測った値が正しいか**を見ていなかった。『自前実装で測った』がこの装置の最大の弱点なので塞ぐ。方針書 (研究観点 §6-1) は kubota0130/ipc との突き合わせを挙げているが、実装が合うことは『両方が同じように間違っている』可能性を消せない。解析解のある状態行列なら合っているかを直接測れ、GitHub への依存 (CI がネットワークとリポジトリの生死に縛られる) も増えない。実測: 状態が [u[t-1], ..., u[t-6]] のとき ipc_total = 6.0000 / ipc_linear = 6.0000 / ipc_nonlinear = 0.0000 / mc_total = 6.0000 で、いずれも厳密解と 1e-4 以内。状態が P2(u[t-1]) だけのときは total 1.0000 / linear 0.0000 / nonlinear 1.0000 で、**次数の分解まで**正しい (総量だけ合っていても分解が壊れていることはあるので、両方を見る)。遅延ごとの分解も遅延 1..K に 1.0、それ以降 0 である。外部実装との突き合わせは、ここが緑になったうえで手で1回やる価値がある。トポロジを系列長掃引の軸にしたのは方針書 §6-2 —— 『ハブ型は飽和に必要な T が長いかもしれない。もしそうなら同じ T で ER と BA を比べた文献は BA を過小評価している』ためで、これは §1 の結論を左右するので §1 より先に確かめる。既定を空タプルにしてあるので既存の成果物は動かない (実測: meta.json の増分は length_sweep.topologies の1鍵だけ、値の変化 0)。振ったときだけ condition_id に topology が入るのは D-118 の『振っていない軸は入れない』に従ったもので、**振らないと BA と次数保存ランダム化が同じ nominal density のため行を区別できない**ことを実測して決めた。変異注入: 遅延線の状態で ipc_total が K にならない実装にすると guard_test が赤"
  guard_test: "tests/test_capacity_analytic_oracle.py::test_a_perfect_delay_line_has_exactly_k_units_of_linear_capacity"
