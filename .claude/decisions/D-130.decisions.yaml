- id: D-130
  rule: "掃引軸は入れ子の設定へ1段だけ潜る (topology.m / topology.density)。記法は --set と同じドット区切りにする。2段以上は潜らない"
  rationale: "numeric_axes は『フィールドが軸である』という設計だが、数値でないフィールド (= 入れ子の設定) を軸から外すので topology の中に入れなかった。実測: ESN の軸は6つで topology.m も m も density も ValueError。**density は topology に移ったので、分離前にできた density の掃引もできなくなっていた** —— リファクタで機能が減っていた。効くのは今後の中心的な実験である: 『m を 1 から 8 に振ると MC はどう動くか』(BA のハブの強さ)、『beta を 0 から 1 に振ると格子からランダムへ動かしたときどこで自走が安定するか』(WS)。どちらも掃引機構では書けず専用ループを書くことになり、**それはこのリファクタが消したはずの形**である。記法を --set と同じドットにするのは、設定を指す言葉が2つあると『どちらで書くのか』を毎回確かめることになるため。1段に限るのは、深さを制限しないと軸名が長くなるだけでなく格子を書く人が『どこまで潜れるのか』を確かめることになるからで、2段目が要るようになったらそれは設定の入れ子が深すぎるというシグナルである。変異注入: numeric_axes の入れ子の走査を外すと guard_test が赤"
  guard_test: "tests/test_reservoir_axes.py::test_nested_axes_reach_one_level_into_the_topology"
