- id: D-146
  rule: "3-T と 3-C'' の図は**独立した PNG を作らず既存の図のパネルに畳む** (3-T は fig_ipc_conservation、3-C'' は fig_narma10)。パネルになった以上この2本は本番の成果物であり、figures-03 が単一の producer になる (ladder-03 / operating-03 は手動実行として残すが一斉再生成からは外す)。梯子は4軸のうち N と rho だけを記事に出す。**縮小設定 (golden / quick / TINY_CONFIG) は掃引の格子を必ず書き換える**"
  rationale: "1記事あたりの図には上限があり (FIG-12 / D-112)、03 は5枚で凍結してある。**凍結値を上げるのはラチェットを外す操作**なので、図を足すなら畳むしかない。3-C'' を fig_narma10 に入れるのは前例がある —— 3-C' (タップ掃引) が既に同じ図のパネルとして入っており、あちらが報告する1点がこちらの面の1点である以上、別の図にすると『その1点を選んだ』ことが読者に見えない。3-T を保存則の図に入れるのは、『容量には上限がある』と『その中でトポロジは効くのか』が読者にとって連続した1つの問いだからで、別々にすると上限の話と構造の話が無関係に見える。梯子の4軸のうち N と rho だけを出すのは、保存則のパネルと合わせて3枚に収めるためで、ノイズと T は『順位が動かない』ことの確認であって動く軸ではない (全件は capacity_topology.csv にある)。パネル化に伴い figures-03 が梯子と動作点を回すことになるが、一斉再生成から ladder-03 / operating-03 を外すので**総時間は変わらない** (2箇所で同じ CSV を書くと、どちらが最後に走ったかで成果物が変わる)。この作業で**掃引の値が絶対値である**という性質が初めて実害を出した: ゴールデン設定に topology_ladder の節が無かったため、n_steps を 900 に縮めてあっても掃引点が N=100 / T=80000 を上書きし、20 秒の予算に対して CLI が 220 秒かかった。**落ちるのは時間の予算だけで結果は正しい**ので気づきにくい。設定ファイルを機械的に見る検査を置いた。0 の参照線に出典を求められた件は cited_bound で解いた —— 差が 0 であることを期待する根拠は次数保存ランダム化が標準の帰無モデル (Maslov & Sneppen 2002) だからで、その意味で理論上限の線と同じ性格である"
  guard_test: "tests/test_config_wiring_capacity.py::test_every_shrunk_config_overrides_the_absolute_sweep_grids"
