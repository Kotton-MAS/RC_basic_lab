- id: D-128
  rule: "可読性のリファクタリングは実測で選ぶ。凍結モジュールを割るときは凍結値を実測値へ下げる (上げない)。引数が8個以上になった関数は、呼び出し側が同じ組を渡しているなら dataclass へ束ねる"
  rationale: "『読みにくい』は感想では動かせないので、モジュール行数・関数行数・引数の数・ネストの深さ・import の数・散文の割合を測ってから選んだ。実測で出た上位は (1) experiment/freerun.py が 1152 行 / import 83 件で全体の最大、(2) capacity_row_from が引数 17 個で全体の最大、(3) 「なぜ/以前は/実測」を含む長い docstring が5本 (CLAUDE.md は根拠を decisions.yaml に置けと定めている) の3つだった。(1) は凝集した2群 —— 教師強制の学習 (freerun_fit.py) と配列を長形式の行へ畳む層 (freerun_profile.py) —— を切り出して 893 行へ。**600 行はまだ超えているので凍結は外れない**が、凍結値は 1152 -> 893 へ下げた。(2) は3つの呼び出し側が**同じ16個を同じ順で**渡していたので、CapacityRowIdentity (条件) と CapacityRowTiming (時間) に束ねて引数を 3 個にした。束ねる過程で capacity.py が 6 行増えたため、識別子の組み立て (identity_for) と CapacityCondition / CSV 列定数を行の層へ移し、714 -> 656 行にした —— **凍結値を上げずに減らす方向で解いた**。(3) は根拠が既に決定にあるものを ID 参照へ畳み、5本 -> 3本にした (残る3本は既存の決定に紐づく実測の記録で、畳むと参照先が無くなる)。**改善しなかった指標も記録する**: 600 行超のモジュールは 6 本のまま、50 行超の関数も 48 本のままである。前者は freerun.py がまだ 893 行だからで、後者は run_and_report_* が『書き出しを並べるだけ』の平たい関数だからである (分けても読む順が増えるだけで読みやすくならない)。成果物は1バイトも動かない (results/ の変更 0 件)。変異注入: 凍結値を上げると赤 (既存の guard がそのまま効く)"
  guard_test: "tests/test_module_line_budget.py::test_the_frozen_list_has_no_stale_entries"
