- id: D-145
  rule: "3-T と 3-C'' に図を1枚ずつ付ける。3-T は総容量ではなく**対応のある差**を掃引軸ごとに並べ、0 の線を引く。3-C'' は左に動作点の面、右に線形容量に対する成績を並べ、遅延線を水平線で置く。**どちらも見出しを行から導き、固定文にしない**。あわせて対照の置き方を汎用側の手引き (docs/guide/対照の置き方.md) にまとめる"
  rationale: "CSV だけでは 1680 行 / 240 行を読まないと結論が出てこない。3-T で総容量を水準ごとに並べる案は採れない —— N や rho で絶対値が2桁動く (実測 N=25 で MC 約10、N=100 で約19) ため水準間の差が潰れて読めない。対応のある差にすれば軸をまたいで同じ縦軸で読め、**0 の線がそのまま結論**になる (上なら BA が良い、2本目が 0 に張り付いていれば次数分布で説明できる)。3-C'' で横軸に非線形の割合ではなく線形容量を取るのは D-144 の実測による: 割合は勝敗を予測せず (勝つ点 0.682 / 0.832、負ける点にも 0.798 / 0.831)、線形容量は完全に分離した (7.98〜19.27 が全敗、25.99 と 27.27 が全勝)。遅延線が選ぶタップ数 25〜30 を帯で置くと交点が読める。見出しを行から導くのは、掃引を広げて結論が変わったときに図が静かに嘘をつくのを防ぐため (D-90 と同じ規律) で、テストは BA の値を作り変えて見出しが追随することを測る。3-C'' の図は**遅延線が動作点で動いていたら描かずに落とす** —— 動いていたら掃引が課題か分割まで動かしており、図の主張の対照そのものが壊れている。対数軸では測った点だけに主目盛りを置く (FIG-19)。既定のままだと 10^2 の位置にしか主目盛りが出ず、25 / 50 / 100 を振っても軸に何も出ない (実測でそうなった)。手引きを汎用側 (docs/guide/) に置くのは D-126 による —— 研究方針 §10 が『いちばん再利用される成果物は結果ではなく対照のプロトコル』としており、連載を知らない形で書けば汎用側だけを切り出したときにそのまま付いていく"
  guard_test: "tests/test_plotting_ladder.py::test_the_ladder_headline_follows_the_rows"
