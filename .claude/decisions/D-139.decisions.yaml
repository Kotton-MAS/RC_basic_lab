- id: D-139
  rule: "対照の梯子 (3-T) は掃引軸を掛けられる (LadderSweepConfig)。**水準の密度は実行時に導出する** —— 密度を指定できない水準 (BA / Watts-Strogatz / リング) が密度を決める側になり、指定できる水準 (Erdos-Renyi とその対照) をそこへ合わせる。YAML に書いた密度は使われない。対の本数を決める n_graphs / n_replicates は掃引軸にできない"
  rationale: "研究方針 §3 (トポロジの順位は N に依存するか) と §4 (ノイズなしで選んだ最適トポロジはノイズ下でも最適か) は、どちらも既存の梯子にもう1軸掛けるだけの実験である。しかし **N を振ると梯子の定義そのものが壊れる**: BA の密度は 2m/N なので N と共に動くのに、ER 水準は YAML の固定値のままになる。実測すると N=25 で BA が ER の2倍 (0.160 対 0.080)、N=100 で半分 (0.040 対 0.080) で、D-138 が排除したはずの『密度が違うから容量が違う』という交絡が掃引点の端で戻ってくる。手で書いた密度は N=50 でしか正しくない値だった。そこで密度を設定値ではなく**導出値**にする。導出の向きを『指定できない側が決める』にしたのは、BA の m が整数で任意の密度を取れない以上そちらは譲れないからで、逆向き (ER に BA を合わせる) は書けない。指定できない水準が複数あるなら互いに一致していなければならず (BA と、その次数列を借りる次数保存ランダム化は定義上一致する)、食い違えば落とす —— 黙って片方に寄せると、寄せられた側が名前と違うものになる。この結果 levels[*].density は『設定したのに効かない葉』になるので、配線検査に CHANNEL_DERIVED を足して**効かないことを == で実測**する (誰かが密度そろえを外したら赤くなる)。n_graphs / n_replicates を振れなくするのは、掃引点ごとに対の本数が変わると水準差の対応のある検定が組めなくなるためである。掃引した値に専用の列を作らないのは、振れる軸が全て既に CSV の列にあるからで、その包含関係自体を test_every_sweepable_axis_is_also_a_csv_column が守る (列に出ない軸を振ると、成果物は同じ条件の繰り返しにしか見えない)。2つの掃引を同じ CSV に入れると基準点 (N=50 / ノイズ 0) が重複するが、そこは**同じ数が出るはずの点**なので掃引点の間で状態が漏れていないことの無料の検査になる。この作業で state_noise が梯子からリザバーへ渡っていない配線漏れが1件見つかった (配線検査が捕まえた)。変異注入で6件とも赤になることを確認した: 密度そろえを外す / state_noise を渡さない / 計画軸のガードを外す / int への丸めを外す / 2本目の掃引を無視する / 軸の存在検査を外す"
  guard_test: "tests/test_topology_ladder.py::test_the_nominal_density_is_the_same_across_levels_at_every_sweep_point"
