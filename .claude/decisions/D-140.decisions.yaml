- id: D-140
  rule: "見込み密度 (nominal_density) は生成されるマスクの密度と一致させる。TopologyControlConfig は変換後 (2d-d^2 / 対角除去) の密度を返し、rescaled_to_density はそこから土台を逆算する (n_units を取る)。BarabasiAlbertConfig は辺を厳密に数える。梯子の行には見込みだけでなく実現値 (realized_density / in_degree_max / in_degree_std) と実効ゲイン (gain_max / gain_std) と記憶の重心 (mc_effective_delay) を出す。交絡4 は spectral_gap では測れない"
  rationale: "梯子の対照そのものが交絡を持っていた。`mask | mask.T` は密度を d から 2d-d^2 に上げるので、実測すると N=50 / d=0.08 の対称化した対照は 0.152 —— ほぼ倍の辺を持っていた。それでも nominal_density は土台の 0.08 を返しており、D-138 / D-139 が『全水準の密度がそろっている』と検査していたのは**そう設定した値どうし**であって、生成された行列ではなかった。したがって #37 / #38 で報告した『対称化 - ER = MC +0.57 (p=0.076)』は密度差と分離できていない (辺が倍あれば容量が増えるのは当たり前である)。BA も近似 2m/N が初期の完全結合を数え落としており、N=25 / m=2 で見込み 0.160 に対し実測 0.1504 と 6% ずれていた —— 梯子は BA の密度を基準に他をそろえるので、そのずれがそのまま水準間の密度差になる。厳密な本数は m(m+1) + 2m(N-m-1) で、実測と小数以下まで一致する。修正後は全水準が実測で ±1.2% 以内 (残差は ER の実現値ごとの揺らぎ) に収まる。見込みと実測を両方 CSV に出すのは、この件が『見込みしか見ていなかったから8サイクル気づかなかった』類の失敗だからで、realized_density を列に置けば次は成果物を見た時点で分かる。交絡4 (rho 正規化との相互作用) を spectral_gap で測る案は**使えない**: 実行列の固有値は共役対で出るので最大固有値が複素なら |l1|-|l2| は構造的に 0 になり、実測でも梯子の5水準のうち4水準でちょうど 0、0 でなかったのは固有値が実数になる対称化した対照だけだった。つまりあれは『ハブが支配的か』ではなく『行列が対称か』を測っている。代わりに行の L2 ノルム (ノードが状態から受ける寄与の大きさ) を effective_gain として出す —— 実測で水準ごとに max 1.407〜1.667 / std 0.239〜0.386 と違いが出る。rescaled_to_density に n_units を足すのは control の逆算に N が要るためで、この関数は前 PR (D-139) で入れたばかりの内部 API であり呼び出し元は matched_levels 1箇所である。変異注入で5件とも赤: control の密度を土台のまま報告する / BA の密度を近似に戻す / control の逆算をやめる / 実効ゲインを列ノルムにする / 次数の広がりを 0 にする"
  guard_test: "tests/test_reservoir_topology.py::test_the_control_density_is_predicted_and_invertible"
