- id: D-138
  rule: "トポロジの主張には対照の梯子 (実験 3-T) を回す。水準は『ER / 対称化だけ / 自己ループ除去だけ / 次数保存ランダム化 / BA』で、密度は全水準そろえ、グラフと重みを入れ子 (n_graphs x n_replicates) にする。交絡を1つだけ動かす対照は TopologyControlConfig で表す"
  rationale: "「スケールフリーは記憶容量に効くか」は既に主張がある問い (Nonlinear Dynamics 2025 は BA が広い rho の範囲で MC が優れると報告) なので、BA を足して測るだけでは追試にしかならない。同じ密度で ER と BA を比べると次数分布・相互結合率・自己ループが同時に動く (D-131) ので、**1つだけ動かした水準**を並べて何が効いているのかを分ける。本命は次数保存ランダム化 (D-135) との比較で、BA の優位が残るなら効いているのは次数分布、消えるなら生成過程が作る別の何かである。密度を 2m/N でそろえるのは、揃えないと『密度が違うから容量が違う』という一番つまらない交絡が最初に効いてしまい、梯子が答えたい問いに届かないため。グラフと重みを入れ子にするのは、トポロジ比較に2種類の分散があるからで、実測 (N=50, T=20000) でグラフ間 s.d. 0.69〜0.83、重み間 s.d. 0.71〜0.94 と**同程度**だった —— 片方だけを振る設計では『BA が良い』がグラフ間分散に埋もれているかを判定できない。本番設定 (N=50 / T=20000 / 8グラフ x 3重み = 120 行、実測 85 秒) の結果: 対応のある差で BA - ER が MC -1.90 / IPC -3.11 (p=1.0 で BA が弱い側)、BA - 次数保存ランダム化が MC +0.13 (p=0.15) / IPC +0.59 (p=0.15)、対称化 - ER が MC +0.57 (p=0.076)、自己ループ除去 - ER が MC -0.04 (p=0.92)。**この条件では BA の劣位は次数分布で説明でき、生成過程の相関構造は効いていない**。ただし rho=0.95 の1点なので、先行が主張する『広い rho の範囲で BA が優れる』は反証も追認もしていない。水準の名前を level 列に分けて持つのは、control が同じ kind のまま2水準あり、行を見て何を変えたか分からないためである。figures-03 の予算の外で手動実行する (symmetry_sweep と同じ扱い)。変異注入で4件とも赤になることを確認した: 水準を1つ落とす / 重み複製を1本にする / control の2水準を同じ名前にする / config.yaml で BA の m だけ 3 にする (密度が崩れる)。**密度の変異は Python の既定値ではなく config.yaml 側に入れる必要があった** —— 既定は密度を 2m/N から導くので m を変えても水準間ではそろったままで、テストが読むのは YAML の方だからである"
  guard_test: "tests/test_topology_ladder.py::test_the_ladder_covers_every_level_graph_and_weight"
