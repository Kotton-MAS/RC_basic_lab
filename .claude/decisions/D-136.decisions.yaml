- id: D-136
  rule: "強駆動での λ の符号と ESP 判定の食い違いは、**0 件を要求せず**『境界の近く (STRONG_DRIVE_BOUNDARY_FACTOR = 2.0 倍以内) で、かつ良性の型 (λ<0 なのに非収束) であること』を要求する。偽の ESP (λ>0 なのに収束) は全条件で 0 件を要求する"
  rationale: "条件付き Lyapunov 指数は参照軌道まわりの**局所**量なので、多安定性 (複数の吸引子が共存する状態) を原理的に検出できない。かつては強駆動でも食い違い 0 件を要求していたが、それは重みの実現値1本に対してたまたま成り立っていただけで、乱数の引き順を直した (D-134) だけで 1 件出た。実測: 唯一の食い違いは λ = -0.01395 = 境界の 1.4 倍で、減衰率も負だった (収束はしているが窓の中で許容差に届かない)。倍率を 2.0 にしてあるのは、1.4 に張り付けると次の実現値でわずかに外れただけで赤くなるためで、**離れた食い違い (= 実装の疑い) を捕まえる**のが目的である。要求を非対称にするのは、偽の ESP のほうが安全側だからで、λ>0 なのに収束と判定されるなら伝播器の入力インデックスずれか判定閾値の緩みを疑う。**この決定は8サイクルにわたり決定ファイルが無いままコードから参照されていた** (D-135 の次が D-138 で、D-136 / D-137 が欠番)。F-ID には参照解決テストがあったが D-ID には無く、『書いたつもりで書いていない』経路が塞がれていなかった。同時に tests/test_decision_id_references_resolve.py を足す"
  guard_test: "tests/test_experiment_esp.py::test_lyapunov_sign_agrees_with_verdict_away_from_boundary"
