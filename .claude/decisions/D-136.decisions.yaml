- id: D-136
  rule: "強駆動 (sigma_u >= STRONG_DRIVE_SIGMA) での λ の符号と ESP 判定の食い違いは、件数ではなく性質で見る。許すのは『良性の型 (λ<0 なのに非収束) かつ境界の 2 倍以内』だけで、偽の ESP (λ>0 なのに収束) は全条件で 0 件を要求し続ける"
  rationale: "かつては強駆動で食い違い 0 件を要求していたが、**それは重みの実現値1本に対して成り立っていただけ**だった —— 乱数の引き順を直した (D-134) だけで 1 件出た。出たのは rho=1.5 / leak=1.0 / sigma_u=0.5 の λ = -0.01395 で、境界 (0.01) の 1.4 倍、減衰率も -0.00886 と負である (収束はしているが窓の中で許容差に届かない)。これは docstring が『λ<0 なのに非収束は起きうる』と明記している多安定性の側で、実装の疑いではない。**件数を固定すると実現値が変わるたびに赤くなり、赤が常態化した検査は誰も見なくなる** (D-113 で実際に起きた)。性質で見れば『境界から離れた食い違い』= 実装の疑いだけを捕まえられる。偽の ESP (n_false_esp) を全条件 0 件で要求し続けるのは、そちらが安全側だからである (実測でも 0 件のまま)。倍率を 2.0 にしたのは、1.4 に張り付けると次の実現値でわずかに外れただけで赤くなるためで、捕まえたいのは桁の違う食い違いである。変異注入: 境界の 3 倍の λ を持つ食い違いを注入すると guard_test が赤"
  guard_test: "tests/test_experiment_esp.py::test_lyapunov_sign_agrees_with_verdict_away_from_boundary"
