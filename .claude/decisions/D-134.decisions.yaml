- id: D-134
  rule: "リザバーの重みは『値を先に引き、そのあとで結合の有無を切り出す』順で作る。結合の構造は SeedStream.TOPOLOGY から引けるようにし (build_reservoir の topology_rng)、渡さなければ重みと同じストリームを使う"
  rationale: "トポロジ比較の前提が壊れていた。実測 (N=200, seed=0): W_in はトポロジより前に引くので ER と BA で一致するが、build_mask が消費する乱数の個数がトポロジによって違うため、その後に引く values がずれ、**共通する辺 84 本ですら W の値が一致しない**。リングに至っては構造が決まりきっているので乱数を1つも消費せず、values の引き始めがさらにずれる。つまり ER と BA は『マスクだけが違う2つの行列』ではなく『マスクも重みの値も違う2つの行列』だった。これは正しさの問題ではない (どれも妥当な実現値である) が、**統計の問題**である: トポロジの効果は重みの実現値の分散と同じくらいの大きさになることがあり、ペアが組めないとその分散を差で潰せない。このリポジトリの統計はペアが前提である (符号検定、D-115 の列ごとの照合)。値を先に引けば同一シードで『同じ重み行列を違うマスクで切り出す』が成立する —— 実測で ER/BA/WS/ring のすべてについて共通辺の値の符号が一致することを確認した。SeedStream に TOPOLOGY を足したのは、グラフの実現値の分散と重みの実現値の分散を分解するため (M グラフ x K 重みの入れ子)。『BA が良い』と言うときグラフ間分散がトポロジ間差より大きければ主張は立たないので、分解できる形にしておく。**成果物は動く**: 01 の ESN 行が相対差 6e-2〜3.3e-1 で動いた (linear / delay_line は動かない。リザバーを使わないため)。これは退行ではなく実現値の入れ替わりで、60 シードで見た分布は一致する (スペクトル半径 2.701±0.086 -> 2.690±0.083、非零 3999.6 -> 3996.8)。本実験の前にやるべき変更なので、意図した変更として指紋を取り直す。変異注入: values の抽選を build_mask の後ろへ戻すと guard_test が赤"
  guard_test: "tests/test_reservoir_topology.py::test_the_same_seed_gives_the_same_weights_under_every_topology"
