- id: D-125
  rule: "実験の宣言は src/rc_basics_lab/experiment/catalog.py の CATALOG 1箇所に置く。実験を1本足すのはここへ ExperimentSpec を1エントリ。experiments/0N_*/run_0N.py は置かず、Makefile は figures-% のパターンルール1本にする。走らせ方の切り替えは真偽フラグではなく --variant <名前> で行う"
  rationale: "実験を1本足すと『同じ事実を3箇所に書く』ことになっていた: experiments/0N_*/run_0N.py (5本、ほぼ同型で 63〜126 行)、main.py の EXPERIMENTS (5エントリ)、Makefile の figures-0N (5ターゲット)。3箇所が独立にドリフトすると make figures-03 と main.py --experiment 03 が別のことをするので、tests/test_main.py が『run スクリプトの DEFAULT_OUT とレジストリの out_dir が一致すること』『run.py と main.py が同じ CSV を出すこと』を事後に照合していた —— **照合が要る形そのものがコストだった**。宣言を1箇所にすると照合テスト4本ごと消える (実測: 976 行削除 / 607 行追加、run スクリプト5本が消滅)。方針書は experiments/0N_*/spec.py を提案していたが、experiments/ はパッケージではなく、そこから宣言を集めるには動的 import が要る。**プラグイン機構を入れない** (方針書 §7) —— case の書き忘れを型検査が落とす、というこのリポジトリでいちばん効いている性質を失うため。静的に import できる1モジュールに5本並べる形にした。variant を真偽フラグ (--length-sweep / --symmetry-sweep / --threshold-sweep) から辞書へ移したのは、フラグが1つ増えるたびに parse_args と main の if が**両方**伸びるためで、辞書なら伸びるのは辞書だけである。副産物として Makefile に埋め込んであった 9 行の python -c (washout-02-unpadded) が variant になった —— **Makefile に書いた計算はテストからもレビューからも見えない**。書き出し先の優先順は --out > --results > scratch/ で、既定を scratch/ にしてあるのは --out を忘れた実行が results/ を黙って上書きしないためである (D-51 と同じ趣旨。ここも1箇所に閉じた)。成果物は新しいコマンド経路 (make figures-0N が main.py --experiment N --results を呼ぶ) で5実験を通しで再生成し、**meta.json は5件すべてで値の変化ゼロ**を確認した。変異注入: CATALOG から実験を1本落とすと guard_test が赤"
  guard_test: "tests/test_main.py::test_experiment_registry_covers_the_experiment_directories"
