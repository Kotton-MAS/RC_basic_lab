- id: D-131
  rule: "トポロジ間の比較では、密度以外に (1) 相互結合率 (2) 自己ループの有無 の2つが同時に動くことを前提として扱う。『スケールフリーだから容量が高い』のような主張をするときは、この2つを分けた対照 (ER を対称化した対照 / BA の対角を埋めた対照) を併せて回す。reservoir/topology.py の docstring はトポロジごとの実態を表で持つ"
  rationale: "モジュールの docstring は『どのトポロジも有向グラフとして扱い、自己結合を消さない』と書いていたが、当てはまるのは Erdos-Renyi だけだった。N=200 での実測: ER は自己ループ 17 本・非対称、Barabasi-Albert と Watts-Strogatz は自己ループ 0 本・**対称**、リングは自己ループ 0 本・非対称。BA / WS は無向グラフの文献アルゴリズムなので、構成上どちらも作れない。**記録と実態がずれていると、次に読む人が『自己結合はどれにもある』という前提で実験を設計する**。実害は実験設計側にある: 同じ nominal density で ER と BA を比べると、差は次数分布だけでなく相互結合率 (BA は W[i,j] と W[j,i] が必ず対で存在し、ER は独立) と自己ループの有無 (自己ループはスペクトル半径の正規化と実効的な漏れに直接効く) も同時に動く。記事で『BA が勝った』を言う段になって必ず問われる箇所なので、コードを直すのではなく**前提として記録する**。対照の作り方まで書いておくのは、必要になった時点で『どう分ければよいか』を考え直さずに済ませるため。変異注入: docstring の表からトポロジを1行落とすと guard_test が赤"
  guard_test: "tests/test_reservoir_topology.py::test_the_docstring_table_matches_the_measured_symmetry"
