- id: D-135
  rule: "トポロジの主張には次数保存ランダム化 (DegreePreservingConfig) を対照として置く。base のグラフの次数列を保ったまま double edge swap で辺を張り替え、生成過程が作った相関構造だけを壊す"
  rationale: "『スケールフリーは記憶容量に効くか』は未解決の問いではなく、すでに主張がある問いである (Nonlinear Dynamics 2025 は BA が広い rho の範囲で MC が優れると報告)。したがって『BA を足して MC を測る』は追試にしかならない。**発見の実験にするには交絡を1つずつ剥がす**。同じ密度で ER と BA を比べると次数分布・相互結合率・自己ループ・rho 正規化との相互作用の4つが同時に動く (D-131 に前2つを記録済み)。梯子の本命は『次数分布だけを残す』水準で、これはネットワーク科学では標準の帰無モデルだが RC のトポロジ研究ではまず置かれていない。ここで BA の優位が残るなら効いているのは次数分布 (先行が支持される)、消えるなら効いていたのは生成過程が作る別の何かである。実測 (N=200, m=2, seed=7): 次数列は完全一致 (最大次数 37 -> 37)、辺の集合は違う、クラスタ係数は 0.0363 -> 0.0206 に半減 —— 次数を保ったまま相関だけが壊れている。base を BA に限っているのは、無向 (対称) のトポロジでないと『入次数と出次数を別々に保つ』手続きが要るためで、用途 (BA のハブを次数だけ残して壊す) には無向で足りる。networkx.double_edge_swap は dev のオラクルとして使い、本体は numpy で書く (D-62 と同じ扱い)。変異注入: 交換で次数が変わる実装にすると guard_test が赤"
  guard_test: "tests/test_reservoir_topology.py::test_degree_preserving_keeps_the_degree_sequence"
