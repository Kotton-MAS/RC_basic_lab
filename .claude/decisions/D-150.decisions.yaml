- id: D-150
  rule: "一時的な指示書・レビューは**消化した時点で本体を消し**、docs/plans/README.md の索引に『いつ・何を指示され・何を生んだか』の1行だけを残す。恒久的に残すのはコードから参照される仕様書 (rc-basics-0N.md、仕様 §N の形で約170箇所) と、まだ着手が残っている方針書だけ。コードと手引きが名指しするリポジトリ相対パスは実在させる (tests/test_guide_references_resolve.py が解決する)"
  rationale: "docs/ が 56 ファイル 17,335 行まで膨らみ、そのうち約 2,650 行が**消化済みの一時指示書**だった (修正指示 2本 / レビュー 2本 / 設計方針 / 図の修正点 / 使いやすさ改善 / 棚卸し / 申し送り / kit への依頼)。残し続けると同じ判断が指示書と決定 (.claude/decisions/) とコードの3箇所に散り、独立にドリフトする —— CLAUDE.md が docstring について言っているのと同じことが文書間でも起きる。**中身は git log --follow で読める**ので、失われるのは検索性だけであり、索引の1行がそれを肩代わりする。消せない基準を2つ置いた: (1) コードが仕様 §N の形で参照する rc-basics-0N.md は約170箇所の根拠なので消すと宙に浮く (2) 着手が残っている方針書 (研究観点の検証方針 §7) は指示がまだ生きている。あわせて docs/モジュール地図.md を消した —— D-126 で docs/guide/ へ移した際の**移動漏れ**で、機械が読んでいるのは guide 側だけ、同じ基名なので被参照数の計測でも 16 件と出て生きているように見えていた。整理の過程で**コードから文書へのパス切れが5件**見つかった (うち3件は本物、2件は『かつてここにあった』という正当な履歴の言及)。文書を移すたびに docstring が静かに宙に浮くので、手引き向けだった参照解決テストをコード側へ広げ、履歴の言及は理由つきの例外表で外す形にした。**例外表に足す操作自体がレビューに出る**ので、外す判断が黙って増えることはない"
  guard_test: "tests/test_guide_references_resolve.py::test_every_path_named_by_the_code_exists"
