- id: D-147
  rule: "枚数 (FIG-12) / 総パネル (FIG-15) / 実行時間 (catalog の budget_s) は**同じものを別の単位で数えている**。1つを守るために他を破らない。3つとも機械で見る —— 時間は tests/test_wall_time_budgets.py がコミット済みの meta.json と budget_s を突き合わせ、90% を超えたら名指しで報告する。予算が中身に合わなくなったら『少し上へ動かす』のではなく中身から引き直し、理由を docs/design.md に書く"
  rationale: "D-146 で 3-T / 3-C'' を既存の図のパネルに畳んだのは、枚数上限 (FIG-12、03 は5枚で凍結) を守るためだった。その結果、総パネルが 13 から 16 へ増えて FIG-15 の上限 12 を超え、figures-03 の実測が 327 秒から 1,754 秒になって catalog の budget_s 900 秒を超えた。**枚数だけが機械で見られていた**ので、枚数を守る変更は緑のまま通り、パネルと時間の超過は誰にも見えなかった (docs/design.md は『予算を 1,800 秒へ引き上げた』と書き直されたのに catalog.py は 900.0 のまま残り、文書と宣言が食い違っても両方緑だった)。**見ている予算だけが守られる**。時間の側に機械を置き、90% 超過を警告する検査も足した —— 03 が 97% で『次に何か足すと確実に超える』状態であることは、それまで誰の目にも入っていなかった。budget_s を 900 から 2,400 へ引き直したのは、900 が 03 が掃引3本 + 3-C の4区間だったときの数字であり、区間が6つになった以上、古い値を少し上へ動かすのは根拠が無いからである (実測 1,754 秒に対し 73%)。パネルの表 (FIG-15) は 13 -> 16 に直したが、**上限 12 は超えたままである** —— 次に 03 へ何かを足すときは『どれかを減らす』から始める。選択肢は 3-T を variant へ戻す / 記事 03 を2本に割る / パネルを畳む の3つで、どれも記事の構成に関わるので実験側だけでは決められない"
  guard_test: "tests/test_wall_time_budgets.py::test_the_committed_wall_time_is_within_its_budget"
