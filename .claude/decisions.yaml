# 意図的な設計判断 (rc-basics-lab)
#
# 正本は散文ではなくこのファイル。各決定には、壊れた瞬間に落ちるテスト
# (guard_test) を必ず紐づける。背景説明は docs/design.md を参照。
#
# 検証: python3 ~/.claude/scripts/check_decisions.py .claude/decisions.yaml
#
# 由来: docs/plans/rc-basics-01.md §6 (D-01〜D-10)。
# guard_test は実在するテストしか書けないため、T3〜T5 で実装されるテストに
# 紐づく決定は、該当タスクの担当者が実装と同時にここへ追記する。
# サイクル1 (T1〜T5) の10件がそろった。
#
# サイクル2 (docs/plans/rc-basics-02.md §6) で D-13〜D-22 を追記した。
# rule / rationale は仕様書の草案そのままではなく、**T1〜T4 が実装に合わせて
# 訂正した版**が正本である (特に D-19 の補償式)。背景と実測値は
# docs/design.md §9 を参照。

- id: D-01
  rule: "診断関数の署名は f(X, u=None, y=None, *, ctx: DiagnosticContext|None) に固定し、拡張は DiagnosticContext への既定値つきフィールド追加のみで行う。DiagnosticContext が持つのはデータの素性 (washout / dt / seed / companion_states) のみとし、診断固有のパラメータはパラメータ化した callable (frozen dataclass の __call__) の構築時に渡す"
  rationale: "要件_01 設計判断1。02 の ESP は2軌道、03 の IPC はサロゲート用シード、04 は dt を要するが、これらを位置引数にすると診断ごとに署名が割れて memristor-rc-lab への移植性が失われる。ctx.companion_states / ctx.dt / ctx.seed に逃がせば 02〜05 の全診断が署名変更なしで乗る。F-1-006: 『拡張は DiagnosticContext への既定値つきフィールド追加のみ』という文言だけだと、診断固有のパラメータまで ctx に押し込む読み方を誘発する。DiagnosticContext は既に dt (04専用) / seed (03専用) / companion_states (02専用) を持ち、05 まで進むと全診断の設定の union になって『どの診断がどのフィールドを読むか』が型から分からなくなる。実例として要件_02 設計判断3 (ESP判定の閾値と窓は設定可能にする) や要件_03 (IPC のサロゲート本数・最大遅延/次数) のパラメータをどこに置くかが、このルールのままでは決まらない。Diagnostic は __call__ を持つ Protocol なので、frozen dataclass の __call__ として書けば署名を変えずに固有パラメータを構築時に渡せる (例: StatePca(cumulative_threshold=0.9))"
  guard_test: "tests/test_diagnostics_base.py::test_all_diagnostics_conform_to_d01_signature_contract"

- id: D-02
  rule: "誤差指標は NRMSE = RMSE / std(y_true) (ddof=0) に統一する。範囲正規化 (max-min) は使わない"
  rationale: "要件_01 未確定3。NRMSE=1 が『平均予測と同等』を意味するため、遅延パリティで線形手法が失敗したことを解釈可能な形で示せる (範囲正規化では 1 に意味が無い)。CSV には nmse を併記し 03 の先行研究比較に備える"
  guard_test: "tests/test_metrics.py::test_nrmse_of_mean_predictor_is_one"

- id: D-03
  rule: "リッジ回帰はバイアス列を正則化しない (罰則行列 D = diag(0,1,1,...))"
  rationale: "バイアスを縮めると目標の平均がずれ、NRMSE=1 という基準線の意味が壊れる。D-02 の解釈性が前提とする性質であり、実装の簡略化で潰されやすい"
  guard_test: "tests/test_ridge.py::test_bias_column_is_not_penalized"

- id: D-04
  rule: "ridge alpha の探索格子は YAML の単一キー ridge.alpha_grid に集約し、全手法・全タスクが同一格子を読む。手法別の alpha 格子キーは ConfigError とする。alpha は (手法, タスク, レプリケート) ごとに検証分割で最良化する"
  rationale: "要件_01 設計判断3。esn-vla-uq §11 の教訓 —— alpha を固定すると手法比較で逆の結論が出うる。『格子は揃え、条件ごとに最良化する』が連載全体の規律であり、これが崩れると 01〜05 の全比較が無効になる"
  guard_test: "tests/test_experiment_fairness.py::test_alpha_grid_is_shared_across_methods"

- id: D-05
  rule: "1レプリケート内では全手法が完全に同一の行 index で学習・評価する。t0 = max(全手法の first_valid, washout) を単一の基準点にする"
  rationale: "遅延線は先頭 n_lags 行を失うため、素直に実装すると手法ごとに評価行が変わり比較が無効になる。要件_01 受け入れ条件1 の『同一分割』の実体はこれ"
  guard_test: "tests/test_experiment_fairness.py::test_all_methods_share_identical_rows"

- id: D-06
  rule: "乱数はリザバー生成 / タスク生成 / 分割の3ストリームに SeedSequence の spawn_key で分離し、1ストリームの変更が他ストリームの乱数列に影響しない"
  rationale: "要件_01 設計判断4。単一 Generator を共有すると『リザバーだけ変えたときの分散』が測れず、受け入れ条件3 の平均±標準偏差の意味が曖昧になる。split ストリームは系列内の開始オフセット選択に実配線し、未使用パラメータを作らない"
  guard_test: "tests/test_seeds.py::test_streams_are_independent"

- id: D-07
  rule: "遅延パリティの既定は n_bits=2, delay=1、入力は ±1 の i.i.d.、目標は該当ラグの積 (y[t] = u[t-1]*u[t-2])"
  rationale: "要件_01 未確定2・受け入れ条件2。この符号化では目標が {1, u[t-k]} の張る線形空間に厳密に直交するため、線形回帰と遅延線の失敗が finite-sample の偶然ではなく解析的に保証される。遅延線も失敗する点が『最も安い対照は遅延線』(記事01 §6) に対する最も鮮明な実演になる。n_bits/delay は掃引軸として YAML 化し、n_bits=3, delay=2 を副条件として併記する"
  guard_test: "tests/test_tasks_parity.py::test_target_is_orthogonal_to_lagged_inputs"

- id: D-08
  rule: "ESN の構造ハイパーパラメータ (N, rho, leak, input_scale, density) は文献既定値に固定し、検証分割で調整しない。検証で選ぶのは alpha (全手法) と遅延線の n_lags のみ"
  rationale: "要件_01 スコープ『網羅探索はやらない・探索予算を揃えることを優先』。結果として探索予算は対照 (遅延線: alpha x n_lags) の方が ESN (alpha のみ) より大きく、非対称性は ESN に不利な側へ倒れる。Goudarzi 2014 が ESN 側だけ最適化して逆の非対称性を作った (survey Q2) のと反対の立場を明示的に取る"
  guard_test: "tests/test_experiment_fairness.py::test_esn_hyperparameters_are_not_validation_selected"

- id: D-09
  rule: "実験設定 YAML の未知キーは ConfigError で即座に失敗させる (寛容な読み飛ばしをしない)"
  rationale: "本サイクルで十数個のパラメータを新設するため、キーのタイプミスが黙って無視されると『設定したのに効いていない』が発生し、実験結果が丸ごと無意味になる。この失敗は LLM レビューでは確率的にしか見つからない"
  guard_test: "tests/test_config.py::test_unknown_key_raises"

- id: D-10
  rule: "日本語フォント対応に新規依存 (japanize-matplotlib 等) を追加せず、実行時に CJK フォント (Hiragino Sans / Noto Sans CJK JP / IPAexGothic / Yu Gothic) を matplotlib.font_manager から探索し、見つからない場合はフォント設定ではなく**ラベル文字列ごと**英語にフォールバックする"
  rationale: "要件_01 制約『依存は最小構成を維持』と『図は日本語フォント対応』の両立。フォント設定だけをフォールバックすると CI 上で豆腐文字の図が『正常に』生成され、生成の成否では検出できない壊れ方をする。記事用の図はローカル (CJK あり) で生成し、CI は生成の成否のみ検証する"
  guard_test: "tests/test_plotting_style.py::test_labels_fall_back_to_english_without_cjk_font"

- id: D-11
  rule: "alpha 格子の下端 1.0e-10 は数値条件数による限界であり、恣意的な打ち切りではない。Mackey-Glass では検証 NRMSE が alpha に対して単調増加で内点解が存在しないため、格子下端が選ばれることは探索の失敗ではなく期待される挙動として扱う (下端が選ばれたことを理由に格子をさらに下へ延ばさない)"
  rationale: "実測 (レプリケート0・遅延線 k=64): 検証 NRMSE は alpha=1e-10 の 5.292627e-04 から alpha=100 の 2.467684e-01 まで単調増加で、最適は alpha->0 (OLS) 側にある。ESN N=200 も同形 (8.171786e-04 -> 2.044276e-01)。下端をこれ以上下げられないのは数値限界のため —— cond(Phi^T Phi) は遅延線 k=64 で 2.0e16、ESN N=200 で 8.0e18 に達し、alpha <= 1.0e-11 では fit_ridge の scipy.linalg.solve(assume_a='pos') が LinAlgError (singular matrix) で落ちる。「格子端が選ばれている = 探索予算が足りない」という一般則 (D-04/D-08 の規律の背景にある考え方) をこの実験に機械的に適用すると誤診になる、というのがこの決定の要点。LinAlgError の出方は BLAS/LAPACK 実装に依存するため guard_test では主張せず、単調性 (= 下端が最良) を固定する"
  guard_test: "tests/test_alpha_grid_lower_bound.py::test_mackey_glass_validation_nrmse_is_monotone_in_alpha"

- id: D-12
  rule: "diagnostics/ 配下は rc_basics_lab.types 以外の自作モジュール (特に config / reservoir) を import しない。診断の設定 dataclass は diagnostics/ 側に定義し、YAML 配線が要るときは config.py 側から diagnostics の設定 dataclass を import する (config → diagnostics の向きのみ許可、逆向きは禁止)"
  rationale: "『diagnostics/ は reservoir に依存しない』が 02〜05・memristor-rc-lab への移植性の前提だが、これまで docstring 3か所 (diagnostics/__init__.py / diagnostics/base.py / conventions.md) の散文にしかなく正本が無かった。実測: `uv run python -c \"import importlib,sys; importlib.import_module('rc_basics_lab.config'); print(sorted(k for k in sys.modules if k.startswith('rc_basics_lab.reservoir')))\"` は ['rc_basics_lab.reservoir', 'rc_basics_lab.reservoir.esn'] を返す。config.py が reservoir.esn.ESNConfig を import しているため、tasks/ の前例 (自分の設定 dataclass を config.py から import する) を diagnostics/ が真似ると reservoir が推移的に引き込まれる"
  guard_test: "tests/test_diagnostics_base.py::test_diagnostics_package_does_not_transitively_import_reservoir_or_config"

- id: D-13
  rule: "実験ごとに設定 dataclass を分ける。02 の設定は Esp02Config に置き、ExperimentConfig (01 専用) には1フィールドも足さない。ローダは load_config_as(path, cls) で共有する"
  rationale: "test_each_parameter_changes_output は『全フィールドが 01 のパイプライン出力を変える』ことを要求する。02 用フィールドを相乗りさせると満たせないフィールドが必ず生まれ、逃がすために例外チャネルを増やすと配線漏れの検出力そのものが落ちる (このテストは本リポジトリ最大の失敗モード『設定したのに効いていない』への唯一の防衛線)。設定を分ければ 01 の被覆は無傷のまま 02 に同型の被覆を作れる。実装では各実験セクション (decay / timescale_sweep / esp_map) に ESNConfig を内包させず、掃引軸だけを平らに持たせた。ESNConfig を内包すると掃引軸である spectral_radius が『YAML から設定できるが実行時に上書きされる死んだフィールド』になり、この決定が防ごうとしている状態を自分で作ることになる。共通のリザバー構造 (input_scale / n_units / density / n_replicates) は Esp02Config.reservoir に1本だけ集約し、3セクションが別々に持って黙って条件が割れる経路を消した"
  guard_test: "tests/test_config_wiring_esp.py::test_all_esp_config_fields_are_covered"

- id: D-14
  rule: "初期状態対の生成に4本目の乱数ストリーム SeedStream.PROBE を使う。01 の SeedConfig には probe を足さず、make_rng_for 経由で 02 の EspSeedConfig から渡す。_STREAM_INDEX[PROBE] は末尾の 3 とし、既存3本の index は動かさない"
  rationale: "ESP 判定の頑健性は『同じ重み・同じ入力で初期状態対だけ振ったときに判定が変わらないか』で測るため、初期状態は reservoir / drive と独立に振れる必要がある。reservoir ストリームから引くと初期状態を変えた瞬間に重みも変わり、この検査が原理的に不可能になる。一方 01 の SeedConfig に probe を足すと D-13 と同じ理由で配線テストが破れる。index を末尾に足すのは、既存3本の spawn_key を動かすと 01 の成果物がバイト単位で再現しなくなるため (test_make_rng_for_matches_make_rng が固定)。make_rng(SeedConfig, PROBE) は ValueError にする —— 無い設定を黙って既定値で埋めるとこの決定が形骸化する"
  guard_test: "tests/test_seeds.py::test_probe_stream_is_independent_of_seed_config_streams"

- id: D-15
  rule: "診断の設定値 (閾値・窓・摂動サイズ) は DiagnosticContext ではなく、既定値つきキーワード引数 cfg で渡す。DiagnosticContext には実行時データ (第2軌道・伝播器) だけを入れる"
  rationale: "D-01 の拡張規約は『ctx への既定値つきフィールド追加』だが、02〜05 の全診断の設定を ctx に積むと、移植先が診断1本を使うために全診断の設定を知る羽目になる。cfg は既定値つきキーワード引数なので D-01 の guard は完全に維持される。境界は『系そのものを表すか (ctx) / 判定基準を表すか (cfg)』。設定 dataclass 自体は純データにし、値域検証は使う側の診断関数が行う (ESNConfig / SplitConfig と同じ流儀)"
  guard_test: "tests/test_diagnostics_esp.py::test_esp_config_is_passed_as_defaulted_keyword"

- id: D-16
  rule: "ESP 判定の距離は RMS/ユニット距離 ||x_a - x_b|| / sqrt(N)。判定は『末尾 window ステップの中央値 <= max(abs_tol, rel_tol * d_initial)』。既定 abs_tol=1e-6, rel_tol=1e-3, window=200。複数ペアは最悪値 (d_tail は最大・d_initial は最小) で判定する。初期状態は両方とも U[-1,1]^N から独立に引き、片方をゼロ状態にしない"
  rationale: "(1) sqrt(N) 正規化により閾値が N に依存せず、N の異なるメモリスタ配列へそのまま移植できる。(2) abs_tol=1e-6 は float64 の eps から十分離れ、初期距離 O(1) から6桁の収縮を要求するので描画の丸めに紛れない。(3) window=200 は 01 の washout と同じ桁。(4) 片方をゼロ状態にすると、無入力では 0 が不動点であるため『2軌道の分離』ではなく『単一軌道の原点への収束』を測ることになり ESP と別の量に化ける。(5) 最悪値の取り方をペアごとの判定の AND にしないのは、報告した d_initial / d_tail と converged が別のペアから来ることになり CSV の3列を見ても判定を再現できなくなるため (この取り方は AND より安全側)。既定値は結論を変えうるので docs/design.md §9 に abs_tol 3 x window 3 の感度表を残した (実測では9通りすべてで sigma_u 別の臨界 rho が1点も動かない)"
  guard_test: "tests/test_diagnostics_esp.py::test_verdict_is_monotone_in_tolerance"

- id: D-17
  rule: "入力強度は駆動信号の標準偏差 sigma_u で定義する (振幅ではない)。一様分布では振幅 a = sqrt(3) sigma_u。掃引中 input_scale は固定し、変えるのは信号側だけ。CSV には sigma_u / input_amplitude / input_drive_std の3列を出す"
  rationale: "要件_02 設計判断4。2-C の横軸が『振幅か分散か』で曖昧になると、記事の主張 (Scholarpedia の再実演) と数値の対応が取れない。標準偏差を主軸に取るのは分布形が変わっても比較可能で、Manjunath & Jaeger 2013 の定式化と同じ土俵に乗るため。振幅も併記するのは Scholarpedia の文言が振幅で書かれているため。input_scale を同時に動かすと『信号を強くした』のか『重みを大きくした』のか分離できなくなる。指定値 sigma_u と実測値 input_drive_std を両方出すのは、駆動生成の取り違えを CSV の2列の食い違いとして表に出すため"
  guard_test: "tests/test_experiment_esp.py::test_input_strength_is_standard_deviation_not_amplitude"

- id: D-18
  rule: "条件付き Lyapunov 指数は摂動法で推定する。delta=1e-8 (RMS/ユニット)、再正規化間隔 1 ステップ、method='perturbation' 以外は ValueError。伝播器は ctx.propagator で受け取り、propagator(X[t], t) が X[t+1] に一致することを実行時に検査する (check_propagator 既定 true)"
  rationale: "要件_02 未確定2・設計判断2。delta=1e-8 は sqrt(eps)=1.5e-8 近傍で、線形性からのずれと丸め誤差が釣り合う古典的な最適点。距離の定義 (D-16) と土俵をそろえるため delta も RMS/ユニットで解釈する (摂動ベクトルの L2 ノルムは delta*sqrt(N))。間隔1は分離が線形域を外れない最も安全な選択で、推定値が解析解と直接照合できる —— 実測では本番 2-C 格子 336 条件の max_observed_growth (1区間あたり成長率の最大) が最大 1.5372 / 中央値 1.0873 で、暴走検出の上限 max_growth=1000 に対して 650 倍の余裕がある (摂動は 1 ステップで 1 桁も成長しておらず線形域の内側にある)。method を文字列にしてあるのは解析 Jacobian 版の差し込み口であり、未実装の値を黙って受理しない。propagator の整合検査は『参照軌道と別の入力で伝播している』配線ミスを実行時に落とすためで、この種のミスは λ が「それらしい値」で出るためレビューでは見つからない (実測: u[t+1] を u[t] に差し替えると λ が -0.02 から +15 へ跳ね、検査を切らない限り全条件で ValueError になる)"
  guard_test: "tests/test_diagnostics_esp.py::test_matches_analytic_exponent_for_linear_map"

- id: D-19
  rule: "washout 感度実験では、washout を増やしても訓練/検証/テストの行数が変わらないよう系列長を伸ばして補償する (pad_series=True が既定)。補償量は washout の差分ではなく t0 の差分 length = base_length + (t0(washout) - t0(min(grid))) とし、t0 は系列を作る前に readout.design.first_valid_for から予測する。補償なしは pad_series=False として残し対比に使う"
  rationale: "make_split は n_usable = T - max_start_offset - t0 で行数を決めるため、washout を増やすと訓練データ量が同時に減る。素直に掃引すると『washout の効果』と『訓練データ量の効果』が交絡し、受け入れ条件5 が別の量の測定になる。この交絡は滑らかな単調曲線として出るため図を見ても気づけない (実測: 補償なしだと MG x ESN の NRMSE が washout に対して完全に単調増加し比 1.0115。補償を入れると単調性が消え比 1.0076 の非単調なノイズになる)。仕様草案の式 base_length + (max(grid) - washout) は符号が逆で、行数をそろえるどころか補償なしより差を広げる (変異注入で行数が 348/310/230/110 に割れることを実測)。補償量を washout の差分にしないのは t0 = max(washout, 各手法の first_valid) が飽和するためで、本番格子では遅延線の最大ラグ 64 により washout=0 と 50 がどちらも t0=64 になり、washout 差分での補償では washout=0 だけ行数がずれる (実測 228 対 230)"
  guard_test: "tests/test_experiment_washout.py::test_washout_sweep_holds_training_size_constant"

- id: D-20
  rule: "λ の符号と ESP 判定の整合の要求は非対称にする。『λ>0 なのに収束 (偽の ESP)』は |λ|>0.01 の全条件で 0 件を要求し、『λ<0 なのに非収束』は許容して件数と sigma_u / rho の内訳を meta.json の verdict_lyapunov_agreement に残す。両者の完全一致は駆動が十分ある領域 (sigma_u >= 0.5) でのみ要求する。この非対称性を『揃っていないから』と対称化しない"
  rationale: "条件付き Lyapunov 指数は参照軌道まわりの局所量なので多安定性を原理的に検出できない。tanh は奇関数なので x* が不動点なら -x* も不動点であり、各不動点は局所安定 (λ<0) でありながら初期状態によって行き先が割れる (= ESP 不成立)。実装者が rho=1.1, sigma_u=0, replicate=0 で4軌道の末尾を直接観測して確認済み —— 4本とも末尾200ステップの時間 s.d. が 6.4e-16 で不動点に到達しており、d(traj0,traj1)=1.2e-16 / d(traj0,traj3)=1.6e-16 に対して d(traj0,traj2)=5.3e-01、しかも ||x0* + x2*||/sqrt(N)=1.3e-16 で traj2 の行き先はちょうど -x0* である (奇対称の対の吸引子)。この条件の λ は -0.032 (局所安定) だが converged=0。対称な一致を要求すると、この実在の現象を実装バグとして潰すことになる。逆向き (λ>0 なのに収束) は理論上あり得ないので 0 件を厳格に要求し、伝播器のインデックスずれや閾値の緩みはそちらで落とす。本番格子の実測: 369 行中、境界近傍 37 件を除く 332 件で偽の ESP は 0 件、『λ<0 なのに非収束』は 27 件 (8.13%) で sigma_u <= 0.2 かつ rho in [1.1, 1.6] に完全に限局し、sigma_u >= 0.5 の 158 件は不一致 0 件"
  guard_test: "tests/test_experiment_esp.py::test_lyapunov_sign_agrees_with_verdict_away_from_boundary"

- id: D-21
  rule: "02 の ESN は bias_scale=0 で構成し、無入力条件 (sigma_u=0) を真の無入力にする。比較軌道は n_pairs=10 本引く"
  rationale: "(1) 定数バイアスは [1; u] の先頭成分に掛かる振幅一定の入力そのものであり、D-17 が入力強度を駆動信号の標準偏差で定義している以上その定義に入らない常時入力は 0 にする。実測: bias_scale=0.1 では無入力・rho=1.2 でも2軌道が収束し受け入れ条件1 が成立しない。(2) 無入力・rho>1 の ESN は +x* / -x* の対をなす吸引子を持つことがあり (D-20 参照)、比較軌道が k 本すべて参照軌道と同じ側へ落ちる確率が約 2^-k 残る。実測: n_pairs=3 では特定のリザバー draw (replicate 2) で rho=1.05〜1.5・無入力が『収束』と誤判定された。10 本 (偽陽性の上限 2^-10 未満) で全レプリケートが正しく非収束になり、rho<1 側の判定は変わらない (n_pairs=30 まで上げても偽陰性なし)。本番 wall time は 43.2s から 83.3s になるが予算 900s の 9%"
  guard_test: "tests/test_experiment_esp.py::test_no_input_decay_matches_spectral_radius"

- id: D-22
  rule: "esp_convergence に渡す ctx の washout は 0 に固定する (experiment.esp.ESP_DISTANCE_WASHOUT)。drive.washout は λ と自己相関の ctx にだけ渡す。02 の esp.fit_skip の既定は 10 とし、診断側の既定 (DEFAULT_ESP, fit_skip=50) は変えない"
  rationale: "esp_convergence で washout が効くのは減衰率の当てはめ開始位置だけで、判定 (末尾 window の中央値) には効かない。2-A は過渡そのものを見せる図であり、距離が floor に届く前に当てはめを始めないと減衰率が測れない。実測: 無入力 rho=0.5 の距離は t=46 付近で 1e-14 を割るため、当てはめ開始が washout(200)+fit_skip(50)=250 だと当てはめ点が 0 点になり decay_rate_per_step が nan になる (rho=0.8 も同様)。過渡を捨てるのは λ と自己相関の側の要求なので、同じ条件でも ctx を2つに分ける"
  guard_test: "tests/test_experiment_esp.py::test_decay_fit_starts_before_the_distance_underflows"

# サイクル 3a (docs/plans/rc-basics-03.md §6)。T1 で D-23 / D-24 / D-28 を、
# T2 (IPC) で D-25 / D-26 / D-27 を追記した。D-24 / D-28 の guard_test は
# T1 では暫定的に MC 側を指していたが、仕様 §6 の本来の指定どおり IPC 側へ
# 差し替えた (MC 側の同等テストは残してあり、両方が回る)。

- id: D-23
  rule: "diagnostics/ は readout.ridge / readout.design を import してよい。config / reservoir は直接・推移のいずれでも禁止し、推移閉包で機械検査する"
  rationale: "D-12 の文言は『types 以外の自作モジュールを import しない』だが guard は reservoir だけを見ていた。IPC は同一 X に対する多数目標の回帰であり、fit_ridge_from_gram (バイアス列を正則化しない D-03 の唯一の実装) を使わないと同じ閉形式解を2箇所に持つことになり D-03 が片方だけで崩れる。readout.ridge は metrics/types しか import しないため移植性の前提は保たれる。禁止対象に config を明示的に足すことで guard は現状より強くなる —— 実測: 検出フィルタに ['rc_basics_lab.config'] を与えると旧 guard は [] (見逃し)、新 guard は ['rc_basics_lab.config'] を返す。diagnostics/dummy.py に `from rc_basics_lab import config` を一時的に入れると新 guard は leaked=['rc_basics_lab.config', 'rc_basics_lab.reservoir', 'rc_basics_lab.reservoir.esn'] で落ちることも確認済み (確認後 revert)。D-12 の guard_test はこのテストの改名に追随させた (決定そのものは変えていない)"
  guard_test: "tests/test_diagnostics_base.py::test_diagnostics_package_does_not_transitively_import_reservoir_or_config"

- id: D-24
  rule: "MC / IPC は全目標を同一の行集合で回帰する。t0 = max(ctx.washout, 全目標の最大遅延) を単一の基準点とし、遅延ごとに使える行数を変えない"
  rationale: "遅延 k の目標は先頭 k 行が未定義なので、素直に書くと遅延が深いほど標本数が減り容量が系統的に下がる。これは『記憶が減衰している』という測りたい現象とまったく同じ向きに出るため図を見ても気づけない。01 の D-05 と同じ規律を容量測定の軸に適用する。guard_test は T2 で仕様 §6 の本来の指定 (IPC 側) へ差し替えた。IPC を正本にするのは、次数と遅延の2軸があり『次数 4 の目標だけ標本が減る』という MC には存在しない壊れ方まで含めて固定できるため。IPC 側は2つの向きから固定する: (1) washout を最大遅延未満で振っても heatmap が1ビットも変わらない (基準点が単一)、(2) u[t]=t の単調系列を使い、目標の行 j が状態の行 t0+j に、遅延 k の目標が u[t0+j-k] に対応することを値から逆算して確認する。MC 側の同等テスト (tests/test_diagnostics_memory_capacity.py::test_all_delays_share_identical_rows) は削除せず残してある"
  guard_test: "tests/test_diagnostics_ipc.py::test_all_targets_share_identical_rows"

- id: D-28
  rule: "多項式基底は宣言された入力分布に対して正規直交化する。(input_distribution, basis) の未対応な組は ValueError にし、黙って Legendre として扱わない"
  rationale: "要件書 設計判断2。基底が入力測度に対して直交していないと容量が目標間で二重計上され保存則が破れる。破れ方は『N をわずかに超える』という穏やかな形で出るため図では正常に見える。正規化を振幅に追従させることで sigma_u を自由に振れる (D-17 と両立)。対応する組は (uniform, legendre) と (normal, hermite) の2つで、正規化は入力の実測の平均・標準偏差で行う (一様は a = sqrt(3) sigma_u で割ってから Legendre に入れる)。guard_test は T1 では MC 側 (基底1本ずつの直交性) を指していたが、T2 で仕様 §6 の本来の指定 (IPC 側) へ差し替えた。IPC 側が正本なのは、二重計上が起きるのは基底1本ずつではなく IPC が実際に足し合わせる積の目標 Pi_i psi_{n_i}(u[t-k_i]) の間だからで、そこを直接測る必要があるため (実測: T=200000・(uniform, legendre)・次数3 までの 14 目標で max|G/T - I| = 0.00722 < 0.02)。MC 側の同等テスト (tests/test_diagnostics_memory_capacity.py::test_mismatched_distribution_and_basis_raises と test_basis_is_orthonormal_under_declared_input_distribution) は削除せず残してある"
  guard_test: "tests/test_diagnostics_ipc.py::test_basis_is_orthonormal_and_mismatched_pair_raises"

# サイクル 3a T2 (IPC) 分。仕様 docs/plans/rc-basics-03.md §6 の D-25 / D-26 / D-27。
# rule は仕様のまま、rationale は実装で確かめた実測値を足した版が正本。

- id: D-25
  rule: "容量測定の回帰は固定の微小 alpha (既定 1e-9) を使い、検証分割による alpha 選択を行わない。D-04 の alpha 格子は 3-C にのみ適用する"
  rationale: "容量は『線形読み出しで到達可能な最大の説明率』という定義そのものであり正則化は系統的に過小評価する。一方 alpha=0 は N=200 の Gram (cond ~ 1e18, D-11 の実測) で solve が落ちうるため数値安定の下駄として 1e-9 を置く。D-04 を容量測定へ機械的に広げると Dambre 2012 の保存則と比較できなくなる。実測 (N=15, T=4000, rho=0.9, 目標 72 本, threshold_mode=none): alpha=(1e-9, 1e-6, 1e-3, 1, 100) に対し ipc_total_raw = (10.012, 10.012, 10.012, 9.119, 4.831) と単調に減る (小さい alpha では 3 桁目まで同じで、下駄としての 1e-9 が容量を歪めていないことも同時に見える)。guard_test は単調非増加と『alpha=100 で実際に減る』の両方を要求する (向きだけだと、alpha が一切効いていない実装でも通ってしまう)"
  guard_test: "tests/test_diagnostics_ipc.py::test_capacity_is_monotone_decreasing_in_alpha"

- id: D-26
  rule: "IPC は X を条件ごとに1回だけ計算し、Gram も条件ごとに1回だけ作る。目標は chunk_size (D-33 の実効値 chunk_size_effective) 列ずつ生成して rhs に畳み、fit_ridge_from_gram の呼び出し回数は ceil(K/chunk_size_effective) に比例させる"
  rationale: "(delay, degree) ごとに ESN を再実行する素直な設計は実測 4.7us/step x T=1e6 x 2395 通り = 約3.1時間になり実験そのものが回らない。容量は Gram 量だけで閉じるので Phi も Z も再走査は不要。Z 全体を実体化しないのはメモリ制約でもある (19 GB)。実測: 目標を 25 本から 270 本 (10.8 倍) に増やしても solve は 3 回から 4 回にしか増えない (chunk_size=256)。guard_test は solve 回数を『目標チャンク数 + 次数ごとのサロゲートチャンク数』の閉形式と厳密一致で固定するので、チャンク化を外して1本ずつ回帰する実装に戻すと即座に落ちる。既定設定 (打ち切り (60,20,10,6), max_variables=3) の目標数は 601 本で、N=25 / T=50000 の1条件が 0.83 秒 (サロゲート 1600 列込み)"
  guard_test: "tests/test_diagnostics_ipc.py::test_gram_solve_count_does_not_scale_with_target_count"

- id: D-27
  rule: "IPC のしきい値処理はシャッフルサロゲート法を既定とし、閾値は次数ごとに推定する。サロゲートは通常の目標と同一経路で計算する。乱数は ctx.seed のみから引き、surrogate かつ ctx.seed is None なら ValueError"
  rationale: "要件書 設計判断1 / サーベイ Q3 (Kubota 2021 系)。有限標本では容量が系統的に過大評価され、その量は目標の周辺分布に依存するため次数ごとに閾値を分ける。サロゲートを別経路で計算すると閾値と容量が別実装からずれるので同じ関数 (capacity_of_targets) に流す。ctx.seed を必須にするのは、閾値が黙って非再現になると受け入れ条件3 の記録が意味を失うため。代表目標は次数内の列挙順から等間隔で決定的に選ぶ (乱数で選ぶと閾値が非再現になり、先頭から詰めると変数1本の目標に偏る)。実測: 入力と独立な状態 (N=15, T=3000, 目標 601 本) でしきい値後の総容量は生の 0.66〜3.52% (8 シード、平均 2.0%) まで落ちる"
  guard_test: "tests/test_diagnostics_ipc.py::test_surrogate_threshold_requires_ctx_seed_and_is_reproducible"

# サイクル 3a T2 round1 の BLOCKER 修正 (F-03-1-012/013、T=1e6 で peak RSS を
# 4GB 未満に収める) の副産物として round2 で発見された決定。fixer が自分で
# 追加した bounded_chunk_size (指示に無い安全機構) の設計判断を正本化する。
#
# F-03-3-001 (BLOCKER): round2 でこの決定に D-29 を割り当てたが、
# docs/plans/rc-basics-03.md line 9 (ユーザー承認済み) が「3b = T3・T4 + T5
# の残り (D-29〜D-32)」を既に予約しており、line 271 に D-29 = NARMA10 を
# rule/rationale/guard_test 付きで記録済みだった。予約を確認せずに番号を
# 指定したオーケストレータの指示ミスで、正本の中に同じ ID の別定義が2つ
# 存在する状態が成立していた。3b 用の D-29〜D-32 は plan doc の採番のまま
# 動かさず、この決定を D-33 (現行最大 D-29 の次の空き番号) へ改番する。
# design.md / ipc.py / _capacity.py / review-findings-03.md の D-29 参照も
# 同時に D-33 へ置換した。

- id: D-33
  rule: "MC / IPC の chunk_size は結果を変えない性能パラメータであり、1チャンクの目標行列 (T_eff x chunk_size) が _MAX_CHUNK_BYTES (128 MiB) を超える場合に限り、実装が configured より小さい実効値へ黙って下げてよい (configured より大きくはしない)。呼び出し側は cfg.chunk_size を直接使わず CapacityProblem.effective_chunk_size(cfg.chunk_size) を経由し、成果物の params には設定値 (chunk_size) と実効値 (chunk_size_effective) の両方を記録する"
  rationale: "round1 の BLOCKER 修正 (F-03-1-012/013) は指示 (仕様書・plan doc) に無い bounded_chunk_size を fixer が自分で追加したもので、この判断とその根拠 (_MAX_CHUNK_BYTES=128MiB、4GB 予算) が decisions.yaml にも design.md にも plan doc にも記録されていなかった (F-03-2-002)。round2 の4つの reviewer が独立にこの関数を突いた: (1) no-op に差し替えても既存58テストが1件も落ちない空虚な安全機構だった (F-03-2-018 BLOCKER。テスト規模の budget_columns がテスト規模の chunk_size を一度も下回らないため切り詰め分岐が一度も真にならない)。(2) 実効値が params にも guard の閉形式 (D-26) にも反映されず、T=200000/chunk_size=256 で D-26 の期待 solve 回数=2 に対し実際4回になる本番規模の乖離が生じていた (F-03-2-001 HIGH)。(3) 適用が ipc.py 2箇所・memory_capacity.py 1箇所に手書きで複製され、F-03-1-001 で潰した『同じ規律を呼び出し側で複製する』形が別の軸で復活していた。今回 CapacityProblem.effective_chunk_size に一本化し、params に chunk_size_effective を追加し、D-26 の guard (test_gram_solve_count_does_not_scale_with_target_count) にキャップが実際に発動する規模のケースを足して閉形式を ceil(K/effective_chunk_size) に更新した。docs/design.md §11 の既定値表にも _MAX_CHUNK_BYTES の行を足した。round3 (F-03-3-004): rule (iii) (params への記録) 単体を守る guard_test が無く、chunk_size_effective を params から削除しても落ちるテストが0件だった。tests/test_diagnostics_ipc.py::test_params_record_configured_and_effective_chunk_size_when_capped を追加し、guard_test をこちらへ差し替えた (rule (i) の純関数としての正しさは test_bounded_chunk_size_truncates_when_over_budget が引き続き独立に守る)"
  guard_test: "tests/test_diagnostics_ipc.py::test_params_record_configured_and_effective_chunk_size_when_capped"

# サイクル 3a T2 round3 (F-03-3-003 / F-03-3-019、D-33 の次)。IPC の確保・
# 組合せ計算量を縛る上限群 (max_degrees の既定値・絶対上限、
# _MAX_VARIABLES_FOR_COUNT) を1件にまとめて正本化する。round2 で
# max_degrees / _MAX_VARIABLES_FOR_COUNT を追加した際、判断と根拠が
# decisions.yaml にも plan doc にも記録されず、design.md も存在しない
# D-29 を参照していた (F-03-3-003)。

- id: D-34
  rule: "IPC の確保・組合せ計算量は4段の独立な上限で縛る。(1) max_degrees (既定20、設定フィールド) は len(max_delay_by_degree) の上限であり、psi_table (次数の本数 x 系列長) の確保サイズを縛る。(2) max_degrees 自身にも上書き不能な絶対上限 _MAX_DEGREES=32 を置く (max_degrees を1行引き上げるだけで (1) を素通りできてはならない)。(3) max_variables には上書き不能な絶対上限 _MAX_VARIABLES_FOR_COUNT=20 を置き、count_targets の閉形式 (math.comb) の組合せ爆発を縛る。(4) max_delay_by_degree の各要素にも上書き不能な絶対上限 _MAX_DELAY_BIT_LENGTH=128 (bit) を置き、math.comb のコストが値ではなく桁数に対して伸びる軸 (CWE-400) を縛る。4つとも _validate_config (延いては count_targets の先頭、F-03-3-018) で確保・列挙より前に検査する"
  rationale: "F-03-3-003: round2 で追加した max_degrees=20 と _MAX_VARIABLES_FOR_COUNT=20 の根拠が decisions.yaml にも plan doc にもコードコメントにしか無く、design.md:761 は max_degrees を『(D-29)』と誤って参照していた (D-29 の rule は chunk_size のキャップのみで max_degrees に触れていない)。加えて _MAX_VARIABLES_FOR_COUNT の docstring/テストが根拠にしていた実測ケース (max_delay_by_degree=(1,)*4000, max_variables=4000, 373.73s) は、次数の本数 (4000) が既定 max_degrees=20 を超えるため _validate_config の max_degrees 検査に先に捕まり、count_targets へ到達しなかった (到達不能な根拠)。既定 max_degrees=20 の下の最悪ケース (次数20・遅延20・max_variables=20) は 15us で、_MAX_VARIABLES_FOR_COUNT は『count_targets の実行時間に対する独立した防御』としては実質的に max_degrees を引き上げた場合の後段の砦としてのみ意味を持つ。F-03-3-019 (security, CWE-789): max_degrees 自身は通常の設定フィールドで上限が無く、max_degrees=400 の1行変更だけで round2 の防御 (len(max_delay_by_degree) > max_degrees の検査) を素通りして psi_table を膨らませられた (実測 peak RSS 0.095GB -> 0.721GB)。_MAX_VARIABLES_FOR_COUNT (上書き不能なモジュール定数) と防御強度を揃えるため、_MAX_DEGREES=32 を追加した。_MAX_DEGREES=32 の下で改めて測ると、max_degrees=32・max_variables=32 (_MAX_VARIABLES_FOR_COUNT を仮に外した場合) でも count_targets は 35us・comb(10**300, 20) でも 0.3ms と、_MAX_VARIABLES_FOR_COUNT を除いても count_targets の実行時間は問題にならない水準に収まる。それでも _MAX_VARIABLES_FOR_COUNT を維持するのは (a) 目標1本に掛け合わせる変数の本数として意味のある値域を明示するため、(b) _MAX_DEGREES が将来引き上げられた場合の独立した多重防御のためで、この非対称 (max_degrees は現在 (1) と (2) の二重、max_variables は (3) 単独) を rule に明記した。F-03-3-018: count_targets / enumerate_targets は __all__ の公開関数だが _validate_config を経由せず、max_delay_by_degree=(10**6,)*1600 を count_targets に直接渡すと 107.89s かかっていた。count_targets の先頭に (max_targets / heatmap_cells とは独立な) 組合せ計算量の検査だけを切り出した _validate_combinatorial_bounds を置き、count_targets 経由で enumerate_targets も自動的に保護されるようにした。F-03-4-007 (round4, security, CWE-400): (1)〜(3) は max_delay_by_degree の要素数・max_variables を縛るが、要素の値の桁数には上限が無かった。math.comb(max_delay, n_vars) のコストは値ではなく桁数に対して約 digits^1.6 で伸びるため、既定の (1)〜(3) の下でも max_delay_by_degree=(10**M,)*32 (max_variables=20, max_degrees=32) は M=300 で 0.013s だが M=60000 で 57.02s かかった。この経路は ipc() 本体では heatmap_cells 検査 (F-03-1-016) に保護されるが、公開関数 count_targets / enumerate_targets は max_targets / heatmap_cells の検査を意図的に除外している (F-03-3-018 の rationale: count_targets を目標数の下見に使う既存の呼び出し側の意味を変えないため) ため無防備だった。_MAX_DELAY_BIT_LENGTH=128 (bit、10進で約38桁) を追加し、既定の遅延打ち切り (max_delay<=60) を大きく上回る余裕を持たせつつ math.comb のコスト増を確保・列挙前に縛った。F-03-4-002/F-03-4-013 (round4, test): guard_test が (1) しか単独で固定しておらず、(2)(3) がスコープを絞った Stop フックの再検証で無防備になりうる状態だった。test_out_of_range_config_raises への差し替えで1つの node id が (1)〜(4) をすべて固定するように改めた。パラメトライズの分担 (D-33 と同じ形式で明記): cfg3 (max_delay_by_degree=(1,)*21, max_degrees=20) が (1)、cfg6 (max_degrees=33) が (2)、cfg5 (max_variables=21) が (3)、cfg14 (max_delay_by_degree=(1<<200,)) が (4) を各々独立に守る (test_max_degrees_bounds_the_psi_table_row_count は (1) の別角度からの固定として残し、guard_test からは外した)。F-03-4-010 (round4, security): この4段の外に残る唯一の『上限自体に上限が無い』設定フィールドは max_targets であり、これは意図的である —— max_targets は運用者が明示的に宣言する予算の終端であり絶対上限は置かない。目標数と heatmap 確保量はどちらも max_targets 1本で閉じており (F-03-1-016)、確保はこの検査を経由しない限り発生しない。3b で運用ポリシーとして絶対上限を追加する判断はありうるが、それは別決定として扱う。"
  guard_test: "tests/test_diagnostics_ipc.py::test_out_of_range_config_raises"

# サイクル 3b-1 (docs/plans/rc-basics-03b.md §6)。T1 で D-35 / D-36 / D-37 を
# 追記した。D-38 / D-39 と 3b 用に予約済みの D-29〜D-32 は T2 以降の担当で、
# 参照先のテストが実在しないうちに書くと check_decisions.py が落ちる。
# rule は仕様 §6 のまま、rationale は T1 の実装で確かめた実測値を足した版が正本。

- id: D-35
  rule: "CapacityProblem.from_states に渡す X は呼び出し側 (experiment/capacity.py) が read-only にしてから渡す。診断側でコピーはしない"
  rationale: "CapacityProblem は X の**ビュー**を持ち gram は構築時点の**スナップショット**なので、構築後に X を書き換えると両者が例外も警告もなく desync する (3a の実測で容量が 1.25e8 という桁違いの値になった)。from_states は自分が保持するビュー (problem.x) だけを writeable=False にできるが、**元の X の writeable フラグは変えない** (F-03-3-006 / F-03-4-001) ため、X 自身への書き込みは呼び出し側でしか塞げない。診断側で防御的にコピーすると T=1e6 / N=200 で 1.6GB 増えて 4GB のメモリ予算を壊す (F-03-1-012/013 で潰したのと同じ失敗)。実装は evaluate_capacity_condition が simulate_reference_trajectory の返り値に対して states.flags.writeable = False を1回だけ立て、その同じ配列を MC と IPC の両方へ渡す。なお MC と IPC は t0 が異なる (MC は max(washout, mc.max_delay)、IPC は max(washout, max(ipc.max_delay_by_degree))) ため CapacityProblem は条件あたり2個作られるが、これは正常であり『1個にまとめる』最適化をすると D-24 の単一基準点がどちらかの診断で壊れる。変異試験: capacity.py の states.flags.writeable = False の1行を消すと guard_test が `assert True is False` で落ちることを実測済み (他の9件は緑のままなので、この1行を守っているのはこのテストだけである)"
  guard_test: "tests/test_experiment_capacity.py::test_states_are_read_only_before_capacity_problem"

- id: D-36
  rule: "state_noise は experiment/esp.py の build_esn_config / simulate_reference_trajectory に**既定値つきキーワード**で足し、ESN.run には常に rng (リザバー重み生成に使った Generator の続き) を渡す。02 の呼び出しは書き換えない"
  rationale: "3-B' の受け入れ条件2 (ノイズ下では IPC_total が厳密に N 未満) を測る経路が変更前は**存在しなかった**。build_esn_config が ESNConfig.state_noise を設定せず、simulate_reference_trajectory が esn.run(u, x0=x0) を rng なしで呼んでいたため、state_noise>0 を設定すると ESN._update が『state_noise > 0 のときは rng が必要です』で ValueError になる (仕様 §2.4-4)。rng を条件分岐で渡す実装にすると同じ配線漏れが再発するので**常に**渡す。ESN は state_noise=0 のとき乱数を1個も引かないので既存結果は不変で、これは 01 の runner.plan_replicate (reservoir.run(data.u, rng=reservoir_rng)) の前例と同じ形である。実測 (T1 完了時点): 02 の本番設定を /tmp へ再生成して results/02_esp_and_dynamics/ と突き合わせたところ、esp_diagnostics.csv 369 行 / washout_sensitivity.csv 180 行で**値が異なる列は wall_time_s (実行ごとに変わる実測時間) の1本だけ**、図4枚 (fig_esp_decay / fig_leak_timescale / fig_esp_map / fig_washout_sensitivity) は PNG バイト単位で一致した。guard_test は 02 の simulate_condition().states と 03 経路 (state_noise=0.0 を明示) の states が np.array_equal であることを固定する"
  guard_test: "tests/test_experiment_capacity.py::test_reference_states_match_esp_simulate_condition"

- id: D-37
  rule: "サロゲートしきい値の ctx.seed は Capacity03Config.seeds.surrogate 1個を全条件・両診断 (MC / IPC) で共有する (共通乱数法)。条件ごとに振らない"
  rationale: "しきい値は有限標本のかさ上げの推定量 (D-27) であり、条件ごとに独立なシードで推定すると、条件間の容量差にしきい値の推定ノイズが独立に乗る。03 の主張はすべて条件間の**差** (rho を上げるとプロファイルが伸びる / ノイズを入れると N に届かなくなる) なので、共通乱数法で差の分散を落とす。seeds.surrogate は SeedStream ではなく ctx.seed へ直接渡る整数であり、seeds.py の既存4ストリームの spawn_key を1つも動かさない (D-14 と同じ理由で 01/02 の成果物に影響しない)。配線の実体は evaluate_capacity_condition が DiagnosticContext を1個だけ作り、memory_capacity と ipc の両方へ同じオブジェクトを渡すこと。guard_test は全条件・両診断の ctx.seed が seeds.surrogate と一致し、同一条件では ctx オブジェクトそのものが共有されること、行に seed_surrogate として記録されることを固定する (共有しているだけでは『届いている』証明にならないので、seeds.surrogate を変えると mc_threshold が動くことを test_surrogate_seed_actually_moves_the_threshold が別途実測する)"
  guard_test: "tests/test_experiment_capacity.py::test_surrogate_seed_is_shared_and_recorded"

# サイクル 3b-1 T2 (docs/plans/rc-basics-03b.md §6)。D-39 と 3b 用に予約済みの
# D-29〜D-32 は 3b-2 (T4/T5) の担当なのでここには書かない (参照先のテストが
# 実在しないうちに書くと check_decisions.py が落ちる)。

- id: D-38
  rule: "cfg 依存でキー集合が変わる量 (IPC の ipc_threshold_degree{d}) は capacity.csv の列にせず、長形式の capacity_profile.csv の行に落とす。書くのはしきい値後の容量が厳密に正のセルだけで、その規準は IPC の n_targets_kept (np.count_nonzero(kept)) と同一にする"
  rationale: "F-03-1-005: ipc() が返す scalars は ipc_threshold_degree{d} を len(cfg.max_delay_by_degree) 本だけ持つため、キー集合が cfg に依存する。これを列にすると『CSV の列順は行 dataclass の宣言順が単一の真実』(§2.2-1) が cfg 依存になり、3-B' だけ打ち切りを (200,60,20,10) に上書きする (片方向) 本仕様では実験ごとに列が変わりうる。次数・遅延・診断名を行の値に落とせば列は静的なままで、しきい値も次数ごとの行に自然に乗る。正値セルだけに絞るのは results/ がコミット対象だからで、全セルを書くと本番設定 (117 条件 x MC 400 遅延 + IPC 240〜800 セル) で約6万行になる。規準を n_targets_kept と同一 (> 0) にするのは、『しきい値を超えた目標の数』と『CSV に在る行』が別々にドリフトすると成果物から保存則の検算ができなくなるため。実測 (本番 figures-03): capacity.csv 117 行 (45 KB) / capacity_profile.csv 21636 行 (1.70 MB) / 合計 1.78 MB (予算 5 MB)。しきい値は CapacityOutcome.ipc_thresholds として1条件につき1回だけ運ぶ —— 行を書くときに ipc() を呼び直すと同じ条件で診断を2回走らせることになり、3-B' では1条件あたり 6.6 秒の再計算になる。guard_test は打ち切りの本数が違う2設定 ((8,4) と (8,4,3)) で列が同一であることと、capacity <= 0 の行が0件であることの両方を実測する"
  guard_test: "tests/test_capacity_pipeline.py::test_profile_csv_columns_are_static_and_cells_are_positive"
